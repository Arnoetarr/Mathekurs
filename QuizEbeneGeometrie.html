<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geometrie-Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#f1f5fb; --paper:#ffffff; --soft:#eef2f7;
  --grid:#cadcec; --text:#1f2430; --muted:#5a6372;
  --line:#2e333a; --fill:#dbe5f1;
  --c-ks:#2563eb; --c-gb:#15803d; --c-wi:#e8590c; --c-sy:#9333ea;
  --ink:#2563eb; --on-c:#ffffff;
  --axis:#d6336c;
  --ok:#15803d; --bad:#dc4a0c; --mid:#b77900;
  --btn:#ffffff; --btn-border:#c9d3df;
  --c:var(--c-ks);
  color-scheme:light dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#10141b; --paper:#1a2029; --soft:#232b36; --grid:#2c3a48; --text:#e8ecf2; --muted:#a0abb8;
  --line:#e2e7ec; --fill:#34414f;
  --c-ks:#6ea0ff; --c-gb:#4fd08a; --c-wi:#ff9a5c; --c-sy:#c18bff; --ink:#6ea0ff; --on-c:#10141b;
  --axis:#ff77a9; --ok:#4fd08a; --bad:#ff8f5a; --mid:#f2bd4b; --btn:#212934; --btn-border:#3a4757;}}
:root[data-theme="dark"]{
  --page:#10141b; --paper:#1a2029; --soft:#232b36; --grid:#2c3a48; --text:#e8ecf2; --muted:#a0abb8;
  --line:#e2e7ec; --fill:#34414f;
  --c-ks:#6ea0ff; --c-gb:#4fd08a; --c-wi:#ff9a5c; --c-sy:#c18bff; --ink:#6ea0ff; --on-c:#10141b;
  --axis:#ff77a9; --ok:#4fd08a; --bad:#ff8f5a; --mid:#f2bd4b; --btn:#212934; --btn-border:#3a4757;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--text);font-family:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:1.0625rem;line-height:1.5;
  background-color:var(--page);
  background-image:radial-gradient(color-mix(in srgb,var(--c-ks) 18%,transparent) 1.2px,transparent 1.3px);
  background-size:22px 22px}
.wrap{max-width:780px;margin:0 auto;padding:1.1rem 1rem 2.5rem}
header{display:flex;align-items:center;gap:.9rem;margin-bottom:1rem;flex-wrap:wrap}
header svg{width:120px;height:auto;flex:0 0 auto}
header h1{font-size:2.2rem;line-height:1.05;margin:0}
header h1 span:nth-child(1){color:var(--c-ks)} header h1 span:nth-child(2){color:var(--c-wi)}
header p{margin:.15rem 0 0;color:var(--muted)}
.sheet{background:var(--paper);border:1.5px solid var(--btn-border);border-top:7px solid var(--c);
  border-radius:16px;padding:1.4rem;box-shadow:0 6px 20px rgba(30,50,90,.08)}
@media (max-width:520px){.sheet{padding:1rem .85rem}}
.t-ks{--c:var(--c-ks)} .t-gb{--c:var(--c-gb)} .t-wi{--c:var(--c-wi)} .t-sy{--c:var(--c-sy)}
h2{font-size:1.4rem;line-height:1.25;margin:.3rem 0 .8rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.topic{display:inline-flex;align-items:center;gap:.35rem;font-weight:700;font-size:.95rem;color:var(--on-c);
  background:var(--c);border-radius:999px;padding:.2rem .8rem}
.count{font-size:.95rem;color:var(--muted);font-weight:700}
.segs{display:flex;gap:4px;margin:.8rem 0 1rem}
.segs i{flex:1;height:10px;border-radius:99px;background:var(--soft);border:1.5px solid color-mix(in srgb,var(--sc) 45%,transparent)}
.segs i.done{background:var(--sc);border-color:var(--sc)}
.segs i.now{background:color-mix(in srgb,var(--sc) 35%,transparent)}
.fig{display:flex;justify-content:center;margin:.3rem 0 1rem;padding:.5rem;border-radius:12px;background:color-mix(in srgb,var(--c) 6%,transparent)}
.fig svg{width:100%;max-width:300px;height:auto}
.opts{display:grid;gap:.6rem}
@media (min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.btn{font:inherit;color:var(--text);background:var(--btn);border:2px solid var(--btn-border);border-radius:14px;
  padding:.55rem .9rem;min-height:52px;cursor:pointer;text-align:left;transition:transform .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--c);transform:translateY(-1px)}
.opt{display:flex;align-items:center;gap:.7rem}
.opt .let{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;
  background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.opt.right{background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:var(--ok);font-weight:700}
.opt.right .let{background:var(--ok);color:var(--on-c)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 14%,transparent);border-color:var(--bad)}
.opt.wrong .let{background:var(--bad);color:var(--on-c)}
.opt:disabled{cursor:default}
.primary:disabled{opacity:.45;cursor:not-allowed}
.opt.dim{opacity:.55}
.opt.plain{justify-content:center;font-weight:700;font-size:1.15rem}
.primary{background:var(--c);border-color:var(--c);color:var(--on-c);font-weight:700;text-align:center}
.primary:hover:not(:disabled){filter:brightness(1.08)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.fb{display:flex;gap:.8rem;align-items:flex-start;margin:1rem 0 .6rem;padding:.75rem .9rem;border-radius:14px}
.fb .ic{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;font-weight:700;color:var(--on-c)}
.fb.ok{background:color-mix(in srgb,var(--ok) 13%,transparent)} .fb.ok .ic{background:var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 12%,transparent)} .fb.bad .ic{background:var(--bad)}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.streak{font-size:.9rem;font-weight:700;color:var(--ok)}
.row{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
label.name{display:block;font-weight:700;margin:1rem 0 .3rem}
input[type=text]{font:inherit;color:var(--text);background:var(--btn);border:2px solid var(--btn-border);border-radius:12px;padding:.5rem .7rem;width:100%;max-width:320px;min-height:48px}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.6rem 0 1rem;padding:0;list-style:none}
@media (max-width:480px){.tlist{grid-template-columns:1fr}}
.tlist li{border-radius:12px;padding:.5rem .8rem;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border:2px solid color-mix(in srgb,var(--c) 40%,transparent)}
.note{color:var(--muted);font-size:.95rem}
.helprow{display:flex;justify-content:flex-start;margin:-.3rem 0 .7rem}
.helpbtn{min-height:42px;padding:.35rem .9rem;border-style:dashed;border-color:var(--mid);font-weight:700}
.helpbox{border:2px dashed var(--mid);background:color-mix(in srgb,var(--mid) 9%,transparent);border-radius:14px;padding:.6rem .9rem;margin:0 0 1rem}
.helpbox svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto}
.helpbox p{margin:.4rem 0 0}
.h-t{fill:var(--text);font-size:13px}
.h-1{stroke:var(--c);stroke-width:4;stroke-linecap:round;opacity:.85} .h-1t{fill:var(--c);font-weight:700}
.h-2{stroke:var(--axis);stroke-width:4;stroke-linecap:round;opacity:.85} .h-2t{fill:var(--axis);font-weight:700}
.zdot{fill:var(--axis)}
.hp{color:var(--mid);font-weight:700}
.res p.hp{margin-top:.5rem}
.drawnote{margin:-.4rem 0 .6rem;color:var(--muted)}
.fig.draw svg{max-width:340px}
.score{display:flex;align-items:center;gap:1rem;margin:.4rem 0 1rem}
.score .big{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;text-align:center;line-height:1.05;
  background:conic-gradient(var(--c-ks) 0 25%,var(--c-gb) 0 50%,var(--c-wi) 0 75%,var(--c-sy) 0);padding:7px;flex:0 0 auto}
.score .big div{width:100%;height:100%;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-weight:700;font-size:1.5rem}
.score .big small{display:block;font-size:.8rem;color:var(--muted);font-weight:400}
.res{border-radius:14px;padding:.8rem 1rem;margin:.7rem 0;border:2px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent)}
.res h3{margin:0;font-size:1.15rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;color:var(--c)}
.stars{letter-spacing:.08em;font-size:1.3rem;white-space:nowrap;color:var(--c)}
.stars .off{opacity:.25}
.res p{margin:.3rem 0;font-weight:700}
.res ul{margin:.3rem 0;padding-left:1.2rem}
details.answers{margin-top:1rem;border:2px dashed var(--btn-border);border-radius:12px;padding:.5rem .9rem}
details.answers summary{font-weight:700;cursor:pointer}
.al{margin:.6rem 0 0;padding-left:1.4rem}
.al li{margin:.45rem 0}
.al .y{color:var(--ok);font-weight:700} .al .n{color:var(--bad);font-weight:700}
.save-msg{font-size:.92rem;color:var(--muted);margin:.4rem 0 0;text-align:right}
/* SVG */
.s-paper{fill:var(--paper)} .s-grid{stroke:var(--grid);stroke-width:1}
.s-axis{stroke:var(--line);stroke-width:2;fill:none} .s-arrow{fill:var(--line)}
.s-num{fill:var(--muted);font-size:12px;text-anchor:middle;dominant-baseline:central}
.s-lbl{fill:var(--text);font-size:17px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.s-it{font-style:italic;font-weight:400}
.s-pt{fill:var(--c)}
.s-line{stroke:var(--line);stroke-width:2.5;fill:none;stroke-linecap:round}
.s-thin{stroke:var(--c);stroke-width:2;fill:none}
.s-dash{stroke:var(--c);stroke-width:2;stroke-dasharray:6 5;fill:none}
.s-fig{fill:color-mix(in srgb,var(--c) 22%,transparent);stroke:var(--c);stroke-width:2.5;stroke-linejoin:round}
.s-mirror{stroke:var(--axis);stroke-width:2.5;stroke-dasharray:14 5 3 5;fill:none}
.s-cand{fill:var(--c-ks)} .s-candl{fill:var(--c-ks);font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#000} header svg,.row,.save-msg{display:none!important}
  .sheet{box-shadow:none;border:1px solid #999;border-top:4px solid #999}
  details.answers{border:none;padding:0} details.answers summary{list-style:none}
  .res{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 130 60" aria-hidden="true">
      <circle cx="16" cy="40" r="13" fill="var(--c-ks)"/>
      <polygon points="34,54 50,22 66,54" fill="var(--c-gb)"/>
      <path d="M72 54 L104 54 M72 54 L96 26" stroke="var(--c-wi)" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M84 54 A12 12 0 0 0 80.3 45" stroke="var(--c-wi)" stroke-width="3" fill="none"/>
      <path d="M110 8 L110 56" stroke="var(--c-sy)" stroke-width="3" stroke-dasharray="7 3 2 3"/>
      <polygon points="103,20 96,30 103,40" fill="var(--c-sy)"/><polygon points="117,20 124,30 117,40" fill="var(--c-sy)" opacity=".55"/>
    </svg>
    <div><h1><span>Geometrie</span>-<span>Quiz</span></h1><p>Koordinatensystem, Grundbegriffe, Winkel, Symmetrie</p></div>
  </header>
  <main class="sheet" id="app" aria-live="polite"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";
const app=document.getElementById('app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PR='\u2032';

// ---------- SVG-Bausteine ----------
function ks(n,pts,extra){
  const u=34,o=34,W=o+n*u+34,H=o+n*u+30;const Y=y=>H-o-y*u,X=x=>o+x*u;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Koordinatensystem"><rect class="s-paper" width="'+W+'" height="'+H+'"/>';
  for(let i=0;i<=n;i++){s+='<line class="s-grid" x1="'+X(i)+'" y1="'+Y(0)+'" x2="'+X(i)+'" y2="'+Y(n)+'"/><line class="s-grid" x1="'+X(0)+'" y1="'+Y(i)+'" x2="'+X(n)+'" y2="'+Y(i)+'"/>';}
  s+='<line class="s-axis" x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+(X(n)+20)+'" y2="'+Y(0)+'"/><polygon class="s-arrow" points="'+(X(n)+26)+','+Y(0)+' '+(X(n)+16)+','+(Y(0)-5)+' '+(X(n)+16)+','+(Y(0)+5)+'"/>';
  s+='<line class="s-axis" x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(0)+'" y2="'+(Y(n)-20)+'"/><polygon class="s-arrow" points="'+X(0)+','+(Y(n)-26)+' '+(X(0)-5)+','+(Y(n)-16)+' '+(X(0)+5)+','+(Y(n)-16)+'"/>';
  for(let i=1;i<=n;i++){s+='<text class="s-num" x="'+X(i)+'" y="'+(Y(0)+14)+'">'+i+'</text><text class="s-num" x="'+(X(0)-13)+'" y="'+Y(i)+'">'+i+'</text>';}
  s+='<text class="s-num" x="'+(X(0)-11)+'" y="'+(Y(0)+12)+'">0</text>';
  s+='<text class="s-lbl s-it" x="'+(X(n)+22)+'" y="'+(Y(0)+16)+'">x</text><text class="s-lbl s-it" x="'+(X(0)+14)+'" y="'+(Y(n)-22)+'">y</text>';
  if(extra)s+=extra(X,Y);
  (pts||[]).forEach(p=>{s+='<circle class="s-pt" cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="5"/><text class="s-lbl" x="'+(X(p[0])+13)+'" y="'+(Y(p[1])-13)+'">'+p[2]+'</text>';});
  return s+'</svg>';
}
function angle(deg,start,opts){
  opts=opts||{};const cx=opts.cx||150,cy=opts.cy||125,L=110,r=30;
  const a1=start*Math.PI/180,a2=(start+deg)*Math.PI/180;
  const P=(a,l)=>[cx+l*Math.cos(a),cy-l*Math.sin(a)];
  const e1=P(a1,L),e2=P(a2,L);
  let s='<svg viewBox="0 0 300 200" role="img" aria-label="Winkel"><line class="s-line" x1="'+cx+'" y1="'+cy+'" x2="'+e1[0]+'" y2="'+e1[1]+'"/><line class="s-line" x1="'+cx+'" y1="'+cy+'" x2="'+e2[0]+'" y2="'+e2[1]+'"/>';
  if(deg===90){const q1=P(a1,20),q2=P(a2,20);s+='<path class="s-thin" d="M'+q1[0]+' '+q1[1]+' L'+(q1[0]+q2[0]-cx)+' '+(q1[1]+q2[1]-cy)+' L'+q2[0]+' '+q2[1]+'"/>';}
  else{const b1=P(a1,r),b2=P(a2,r);s+='<path class="s-thin" d="M'+b1[0]+' '+b1[1]+' A'+r+' '+r+' 0 '+(deg>180?1:0)+' 0 '+b2[0]+' '+b2[1]+'"/>';}
  s+='<circle class="s-pt" cx="'+cx+'" cy="'+cy+'" r="4"/>';
  if(opts.S)s+='<text class="s-lbl" x="'+(cx-8)+'" y="'+(cy+20)+'">S</text>';
  return s+'</svg>';
}
const figSvg=(pts,w,h,extra)=>'<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Figur"><polygon class="s-fig" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>'+(extra||'')+'</svg>';

// ---------- Fragen ----------
const TOPICS={
  ks:'Koordinatensystem',gb:'Grundbegriffe',wi:'Winkel',sy:'Symmetrie'
};
const Q=[
 // Koordinatensystem
 {t:'ks',skill:'die Koordinaten eines Punktes ablesen',q:'Welche Koordinaten hat der Punkt P?',fig:()=>ks(6,[[4,2,'P']]),
  o:['(4 | 2)','(2 | 4)','(4 | 4)','(2 | 2)'],ex:'Zuerst gehst du nach rechts bis 4 (x-Koordinate), dann nach oben bis 2 (y-Koordinate). Also P(4 | 2).'},
 {t:'ks',skill:'einen Punkt mit gegebenen Koordinaten finden und eintragen',q:'Welcher Punkt hat die Koordinaten (5 | 1)?',fig:()=>ks(6,[[1,5,'A'],[5,1,'B'],[4,4,'C'],[5,3,'D']]),
  o:['B','A','C','D'],plain:true,ex:'(5 | 1) heißt: 5 nach rechts, 1 nach oben. Dort liegt B. Bei A sind die Zahlen vertauscht.'},
 {t:'ks',skill:'die x-Achse, die y-Achse und den Ursprung zeigen',q:'Wo liegt der Punkt Q(0 | 3)?',
  o:['auf der y-Achse','auf der x-Achse','im Ursprung','in der Mitte des Gitters'],ex:'Die x-Koordinate ist 0. Du gehst also nicht nach rechts, sondern nur 3 nach oben. Damit liegt Q auf der y-Achse.'},
 {t:'ks',skill:'die x-Achse, die y-Achse und den Ursprung zeigen',q:'Wie heißt der Punkt mit den Koordinaten (0 | 0)?',
  o:['Ursprung','Scheitelpunkt','Endpunkt','Mittelpunkt'],ex:'Im Punkt (0 | 0) treffen sich die x-Achse und die y-Achse. Er heißt Ursprung.'},
 {t:'ks',skill:'die Koordinaten eines Punktes ablesen',q:'Der Punkt R hat die Koordinaten (6 | 2). Was bedeutet die Zahl 6?',
  o:['Du gehst vom Ursprung 6 Einheiten nach rechts.','Du gehst vom Ursprung 6 Einheiten nach oben.','Du gehst vom Ursprung 6 Einheiten nach links.','R ist der sechste Punkt im Koordinatensystem.'],ex:'Die erste Zahl ist die x-Koordinate. Sie sagt, wie viele Einheiten du vom Ursprung aus nach rechts gehst.'},
 {t:'ks',skill:'Punkte im Koordinatensystem zu einer Figur verbinden',q:'Die Punkte A(1 | 1), B(5 | 1), C(5 | 4) und D(1 | 4) werden der Reihe nach verbunden. Welche Figur entsteht?',draw:true,
  fig:()=>ks(6,[],()=>'<g class="dl"></g>'),
  o:['ein Rechteck','ein Quadrat','ein Dreieck','eine Raute'],ex:'Die Seiten sind 4 und 3 Kästchen lang, alle Ecken sind rechte Winkel. Das ist ein Rechteck. Für ein Quadrat müssten alle Seiten gleich lang sein.'},
 // Grundbegriffe
 {t:'gb',skill:'Strecke, Strahl und Gerade unterscheiden',q:'Was ist hier gezeichnet?',
  fig:()=>'<svg viewBox="0 0 300 80" role="img" aria-label="Linie mit einem Anfangspunkt"><line class="s-line" x1="40" y1="40" x2="295" y2="40"/><circle class="s-pt" cx="40" cy="40" r="5"/></svg>',
  o:['ein Strahl','eine Strecke','eine Gerade','ein Winkel'],ex:'Ein Strahl hat einen Anfangspunkt und geht in eine Richtung unendlich weiter. Eine Strecke hätte zwei Endpunkte.'},
 {t:'gb',skill:'Strecke, Strahl und Gerade unterscheiden',q:'Was hat eine Strecke?',
  o:['zwei Endpunkte','einen Anfangspunkt, aber kein Ende','weder Anfang noch Ende','einen Scheitelpunkt'],ex:'Eine Strecke beginnt in einem Punkt und endet in einem Punkt. Deshalb kann man ihre Länge messen.'},
 {t:'gb',skill:'erkennen, ob Geraden parallel oder senkrecht sind',q:'Wie liegen die Geraden g und h zueinander?',
  fig:()=>'<svg viewBox="0 0 300 200" role="img" aria-label="Zwei Geraden mit rechtem Winkel"><line class="s-line" x1="20" y1="150" x2="280" y2="60"/><line class="s-line" x1="105" y1="15" x2="160" y2="174"/><text class="s-lbl s-it" x="285" y="45">g</text><text class="s-lbl s-it" x="95" y="12">h</text>'+
   (()=>{const cx=140.6,cy=114.7,d=[260/275.1,-90/275.1],n=[55/168.2,159/168.2],s=16;return '<path class="s-thin" d="M'+(cx+d[0]*s)+' '+(cy+d[1]*s)+' L'+(cx+d[0]*s+n[0]*s)+' '+(cy+d[1]*s+n[1]*s)+' L'+(cx+n[0]*s)+' '+(cy+n[1]*s)+'"/>';})()+'</svg>',
  o:['senkrecht','parallel','gleich lang','gespiegelt'],ex:'Die Geraden schneiden sich in einem rechten Winkel (90°). Dann sind sie senkrecht zueinander.'},
 {t:'gb',skill:'erkennen, ob Geraden parallel oder senkrecht sind',q:'Zwei Geraden schneiden sich nie, auch wenn man sie beliebig weit verlängert. Wie liegen sie zueinander?',

  if(deg===90){const q1=P(a1,10),q2=P(a2,10);s+='<path class="s-thin" d="M'+q1[0]+' '+q1[1]+' L'+(q1[0]+q2[0]-cx)+' '+(q1[1]+q2[1]-cy)+' L'+q2[0]+' '+q2[1]+'"/>';}

}

  inp.addEventListener('input',()=>{go.disabled=inp.value.trim().length<2;});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!go.disabled)go.click();});
  go.addEventListener('click',()=>{if(inp.value.trim().length<2){inp.focus();return;}start(inp.value);});
}
function segs(){
  return '<div class="segs" aria-hidden="true">'+S.qs.map((q,i)=>'<i style="--sc:var(--c-'+q.t+')" class="'+(i<S.i?'done':i===S.i?'now':'')+'"></i>').join('')+'</div>';
}
function show(){
  const q=S.qs[S.i];S.picked=null;
  const base=q.o.map((t,k)=>({t,k}));
  S.order=q.plain?base.slice().sort((a,b)=>{const f=x=>x.t.startsWith('keiner')?'zzz':x.t;return f(a).localeCompare(f(b),'de',{numeric:true});}):shuffle(base);
  setTopic(q.t);
  const long=q.o.some(o=>o.length>22);
  app.innerHTML='<div class="top"><span class="topic">'+TOPICS[q.t]+'</span><span class="count">Frage '+(S.i+1)+' von '+S.qs.length+'</span></div>'+segs()+
    '<h2>'+esc(q.q)+'</h2>'+(q.draw?'<p class="drawnote">Tippe die Punkte der Reihe nach ins Koordinatensystem. Sie werden automatisch verbunden.</p>':'')+
    (q.fig?'<div class="fig'+(q.draw?' draw':'')+'">'+q.fig()+'</div>':'')+
    (q.draw?'<div class="row" style="margin-top:-.6rem;margin-bottom:.8rem"><button class="btn" id="clr">Punkte löschen</button></div>':'')+
    '<div class="helprow"><button class="btn helpbtn" id="hb" aria-expanded="false">💡 Hilfe</button></div><div class="helpbox" id="hbox" hidden></div>'+
    '<div class="opts'+(long?'':' two')+'" role="group" aria-label="Antworten">'+
    S.order.map((o,n)=>'<button class="btn opt'+(q.plain?' plain':'')+'" data-n="'+n+'">'+(q.plain?'':'<span class="let">'+LET[n]+'</span>')+'<span>'+esc(o.t)+'</span></button>').join('')+'</div>'+
    '<div id="fbx"></div>';
  if(q.draw)setupDraw();
  const hb=document.getElementById('hb'),hbox=document.getElementById('hbox'),H=HELP[SKILLHELP[q.skill]];
  if(!H)hb.parentNode.remove();
  else hb.addEventListener('click',()=>{
    const open=hbox.hidden;hbox.hidden=!open;hb.setAttribute('aria-expanded',open);hb.textContent=open?'💡 Hilfe ausblenden':'💡 Hilfe';
    if(open){if(!hbox.innerHTML)hbox.innerHTML=H.svg()+'<p>'+esc(H.t)+'</p>';if(S.picked===null)S.helped[S.i]=true;}
  });
  app.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.n)));
  window.scrollTo({top:0,behavior:'smooth'});
}
function setupDraw(){
  const svg=app.querySelector('.fig.draw svg'),layer=svg.querySelector('.dl'),N=6,u=34,o=34,H=o+N*u+30;
  const X=x=>o+x*u,Y=y=>H-o-y*u;let pts=[];
  const NS='http://www.w3.org/2000/svg';
  function render(){
    layer.innerHTML='';
    if(pts.length>1){
      const el=document.createElementNS(NS,pts.length===4?'polygon':'polyline');
      el.setAttribute('points',pts.map(p=>X(p[0])+','+Y(p[1])).join(' '));
      el.setAttribute('class',pts.length===4?'s-fig':'s-dash');layer.appendChild(el);
    }
    pts.forEach((p,i)=>{
      const c=document.createElementNS(NS,'circle');c.setAttribute('cx',X(p[0]));c.setAttribute('cy',Y(p[1]));c.setAttribute('r',6);c.setAttribute('class','s-pt');layer.appendChild(c);
      const t=document.createElementNS(NS,'text');t.setAttribute('x',X(p[0])+12);t.setAttribute('y',Y(p[1])-13);t.setAttribute('class','s-lbl');t.textContent=LET[i];layer.appendChild(t);
    });
  }
  svg.style.cursor='crosshair';svg.style.touchAction='manipulation';
  svg.addEventListener('click',e=>{
    if(pts.length>=4)return;
    const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
    const gx=Math.round((q.x-o)/u),gy=Math.round((H-o-q.y)/u);
    if(gx<0||gx>N||gy<0||gy>N)return;
    if(pts.some(p=>p[0]===gx&&p[1]===gy))return;
    pts.push([gx,gy]);render();
  });
  document.getElementById('clr').addEventListener('click',()=>{pts=[];render();});
}
function answer(n){
  if(S.picked!==null)return;S.picked=n;
  const q=S.qs[S.i],right=S.order[n].k===0;S.answers.push(right);S.given.push(S.order[n].t);
  S.streak=right?S.streak+1:0;
  app.querySelectorAll('.opt').forEach((b,m)=>{b.disabled=true;
    if(S.order[m].k===0)b.classList.add('right');else if(m===n)b.classList.add('wrong');else b.classList.add('dim');});
  const last=S.i===S.qs.length-1;
  const praise=['Richtig!','Super!','Genau!','Stark!'][Math.floor(Math.random()*4)];
  document.getElementById('fbx').innerHTML='<div class="fb '+(right?'ok':'bad')+'"><span class="ic pop">'+(right?'✓':'✗')+'</span><div><b>'+(right?praise:'Leider nicht.')+'</b> '+esc(q.ex)+
    (right&&S.streak>=3?'<div class="streak">'+S.streak+' richtige Antworten hintereinander!</div>':'')+'</div></div>'+
    '<div class="row"><button class="btn primary" id="nx">'+(last?'Zur Auswertung':'Nächste Frage')+'</button></div>';
  const nx=document.getElementById('nx');nx.addEventListener('click',()=>{if(last)result();else{S.i++;show();}});nx.focus({preventScroll:true});
}
function evaluate(){
  return TKEYS.map(t=>{
    const idx=S.qs.map((q,i)=>i).filter(i=>S.qs[i].t===t);
    const ok=idx.filter(i=>S.answers[i]).length,n=idx.length;
    const skills=[...new Set(idx.filter(i=>!S.answers[i]).map(i=>S.qs[i].skill))];
    const hIdx=idx.filter(i=>S.answers[i]&&S.helped[i]),helped=hIdx.length;
    const hSkills=[...new Set(hIdx.map(i=>S.qs[i].skill))].filter(k=>!skills.includes(k));
    const pure=ok-helped;
    let level=ok===n?'ok':ok>=n-1?'mid':'bad';if(level==='ok'&&helped>0)level='mid';
    const msg=level==='bad'?'Das solltest du noch üben:':level==='mid'?(skills.length?'Fast sicher. Schau dir das noch einmal an:':'Fast sicher.'):'Das sitzt. Super!';
    return {t,ok,n,skills,level,msg,helped,hSkills,pure};
  });
}
function result(){
  setTopic(null);
  const total=S.answers.filter(Boolean).length,ev=evaluate(),todo=ev.filter(e=>e.level==='bad').map(e=>TOPICS[e.t]),nHelp=S.helped.filter((h,i)=>h&&S.answers[i]).length;
  const head=total>=14?'Super gemacht!':total>=10?'Gut gemacht!':'Weiter üben lohnt sich!';
  let html='<h2>'+(S.name?esc(S.name)+', das ist':'Das ist')+' deine Auswertung</h2>'+
    '<div class="score"><div class="big"><div><span>'+total+'<small>von '+S.qs.length+'</small></span></div></div><div><b style="font-size:1.25rem">'+head+'</b><br>Du hast '+total+' von '+S.qs.length+' Fragen richtig beantwortet'+(nHelp?', davon '+nHelp+' mit Hilfe':'')+'.</div></div>'+
    (nHelp?'<p class="note">★ = ohne Hilfe richtig, ☆ = mit Hilfe richtig</p>':'');
  ev.forEach(e=>{
    html+='<div class="res t-'+e.t+'"><h3><span>'+TOPICS[e.t]+'</span><span class="stars" aria-label="'+e.ok+' von '+e.n+' richtig">'+'★'.repeat(e.pure)+'☆'.repeat(e.helped)+'<span class="off">'+'★'.repeat(e.n-e.ok)+'</span></span></h3><p>'+e.msg+'</p>'+
      (e.skills.length?'<ul>'+e.skills.map(s=>'<li>Ich kann '+esc(s)+'.</li>').join('')+'</ul>':'')+
      (e.helped?'<p class="hp">💡 Bei '+(e.helped===1?'einer Frage':e.helped+' Fragen')+' hast du die Hilfe gebraucht.'+(e.hSkills.length?' Übe das noch, bis es ohne Hilfe klappt:</p><ul>'+e.hSkills.map(s=>'<li>Ich kann '+esc(s)+'.</li>').join('')+'</ul>':'</p>'):'')+'</div>';
  });
  html+='<p>'+(todo.length?'Fang beim Üben mit '+(todo.length<2?'<b>'+todo[0]+'</b>':todo.slice(0,-1).map(x=>'<b>'+x+'</b>').join(', ')+' und <b>'+todo[todo.length-1]+'</b>')+' an.':'Nimm dir eine schwierige Aufgabe oder hilf anderen beim Üben.')+'</p>'+
    '<p class="note">Vergleiche das Ergebnis mit deiner Ich-kann-Liste. Passt deine Einschätzung?</p>'+
    '<details class="answers"><summary>Deine Antworten ansehen</summary><ol class="al">'+
    S.qs.map((q,i)=>'<li>'+esc(q.q)+'<br>Deine Antwort: '+esc(S.given[i])+' <span class="'+(S.answers[i]?'y">richtig':'n">falsch')+'</span>'+(S.helped[i]?' <span class="hp">(mit Hilfe)</span>':'')+(S.answers[i]?'':'<br>Richtig ist: '+esc(q.o[0]))+'</li>').join('')+'</ol></details>'+
    '<div class="row"><button class="btn" id="again">Neue Fragen</button><button class="btn primary" id="pdf">Gelingensnachweis als PDF</button></div><p class="save-msg" id="savemsg"></p>';
  app.innerHTML=html;
  document.getElementById('again').addEventListener('click',()=>start(S.name));
  document.getElementById('pdf').addEventListener('click',savePdf);
  window.scrollTo({top:0,behavior:'smooth'});
}
// ---------- PDF ----------
const pdfTxt=s=>String(s).replace(/\u2032/g,"'").replace(/[\u2013\u2014]/g,'-');
const TCOL={ks:[37,99,235],gb:[21,128,61],wi:[232,89,12],sy:[147,51,234]};
function buildPdf(){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const PW=210,PH=297,M=16,W=PW-2*M,DARK=[31,36,48],MUT=[90,99,114],OK=[21,128,61],BAD=[200,70,12],MID=[170,110,0];
  const ev=evaluate(),total=S.answers.filter(Boolean).length,nH=S.helped.filter((h,i)=>h&&S.answers[i]).length;
  const T=(t,x,y,size,style,col,opt)=>{doc.setFont('helvetica',style||'normal');doc.setFontSize(size);doc.setTextColor.apply(doc,col||DARK);doc.text(pdfTxt(t),x,y,opt||{});};
  const lh=size=>size*0.3528*1.25;
  const bands=(y,h)=>{[[37,99,235],[21,128,61],[232,89,12],[147,51,234]].forEach((c,k)=>{doc.setFillColor.apply(doc,c);doc.rect(k*PW/4,y,PW/4,h,'F');});};
  const tint=(c,a)=>c.map(v=>Math.round(255-(255-v)*a));
  function star(cx,cy,r,col,filled){
    const pts=[];for(let k=0;k<10;k++){const rr=k%2?r*0.45:r,a=-Math.PI/2+k*Math.PI/5;pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)]);}
    const rel=pts.slice(1).map((p,k)=>[p[0]-pts[k][0],p[1]-pts[k][1]]);
    doc.setLineWidth(0.4);doc.setDrawColor.apply(doc,col);doc.setFillColor.apply(doc,filled===2?tint(col,0.22):col);
    doc.lines(rel,pts[0][0],pts[0][1],[1,1],filled===1?'FD':filled===2?'D':'F',true);
  }
  // ---------- Vorderseite: Gelingensnachweis ----------
  bands(0,7);bands(PH-7,7);
  let y=24;
  T('Gelingensnachweis',M,y,26,'bold');y+=8;
  T('Geometrie: Koordinatensystem, Grundbegriffe, Winkel, Symmetrie',M,y,11,'normal',MUT);y+=12;
  T('Name',M,y,9,'normal',MUT);T('Datum',PW-M-40,y,9,'normal',MUT);y+=7;
  T(S.name,M,y,18,'bold');T(S.date.toLocaleDateString('de-DE'),PW-M-40,y,13,'bold');
  doc.setDrawColor(200,208,218);doc.setLineWidth(0.3);doc.line(M,y+2.5,PW-M-50,y+2.5);doc.line(PW-M-40,y+2.5,PW-M,y+2.5);y+=12;
  // Ergebnisbox
  const head=total>=14?'Super gemacht!':total>=10?'Gut gemacht!':'Weiter üben lohnt sich!';
  doc.setFillColor(244,247,251);doc.setDrawColor(200,208,218);doc.roundedRect(M,y,W,24,4,4,'FD');
  T(String(total),M+14,y+15.5,30,'bold',[37,99,235],{align:'center'});T('von '+S.qs.length,M+14,y+20.5,9,'normal',MUT,{align:'center'});
  T(head,M+30,y+10,15,'bold');
  T(total+' von '+S.qs.length+' Fragen richtig'+(nH?', davon '+nH+' mit Hilfe':''),M+30,y+17,11,'normal',MUT);
  y+=32;
  // Themenkästen: Inhalt bestimmen, dann Platz gleichmäßig verteilen
  const footH=24,avail=PH-7-footH-y,gap=5;
  let fs=11,boxes;
  for(;fs>=8;fs-=0.5){
    boxes=ev.map(e=>{
      const lines=[];const L=s=>doc.setFont('helvetica','normal').setFontSize(fs).splitTextToSize(pdfTxt(s),W-16);
      lines.push({t:e.msg,b:true,c:e.level==='ok'?OK:e.level==='mid'?MID:BAD});
      e.skills.forEach(s=>L('- Ich kann '+s+'.').forEach((l,k)=>lines.push({t:k?'  '+l:l})));
      if(e.helped){lines.push({t:'Bei '+(e.helped===1?'einer Frage':e.helped+' Fragen')+' mit Hilfe gelöst.'+(e.hSkills.length?' Noch ohne Hilfe üben:':''),b:true,c:MID});
        e.hSkills.forEach(s=>L('- Ich kann '+s+'.').forEach((l,k)=>lines.push({t:k?'  '+l:l})));}
      return {e,lines,need:12+lines.length*lh(fs)+3};
    });
    if(boxes.reduce((a,b)=>a+b.need,0)+3*gap<=avail)break;
  }
  const extra=Math.max(0,(avail-3*gap-boxes.reduce((a,b)=>a+b.need,0))/4);
  boxes.forEach(bx=>{
    const e=bx.e,c=TCOL[e.t],h=bx.need+extra;
    doc.setFillColor.apply(doc,tint(c,0.08));doc.setDrawColor.apply(doc,tint(c,0.55));doc.setLineWidth(0.5);doc.roundedRect(M,y,W,h,4,4,'FD');
    doc.setFillColor.apply(doc,c);doc.roundedRect(M,y,3.2,h,1.6,1.6,'F');
    T(TOPICS[e.t],M+8,y+8.5,14,'bold',c);
    for(let k=0;k<e.n;k++){const filled=k<e.pure?0:k<e.ok?2:-1;const sx=PW-M-6-(e.n-1-k)*8.5;
      if(filled===-1){doc.setDrawColor.apply(doc,tint(c,0.3));star(sx,y+7,3.3,tint(c,0.25),0);}else star(sx,y+7,3.3,c,filled);}
    let ly=y+15.5;
    bx.lines.forEach(l=>{T(l.t,M+8,ly,fs,l.b?'bold':'normal',l.c||DARK);ly+=lh(fs);});
    y+=h+gap;
  });
  y=PH-7-footH+6;
  T('Sterne: ausgefüllt = ohne Hilfe richtig, umrandet = mit Hilfe richtig, blass = noch nicht richtig',M,y,8.5,'normal',MUT);
  y+=10;doc.setDrawColor(150,158,170);doc.setLineWidth(0.3);
  T('Eingetragen in die Ich-kann-Liste:',M,y,10,'normal',MUT);doc.rect(M+56,y-3.6,4.2,4.2);
  doc.line(PW-M-70,y,PW-M,y);T('Gesehen (Lehrkraft)',PW-M-70,y+4.5,8.5,'normal',MUT);
  // ---------- Rückseite: Antworten in zwei Spalten ----------
  doc.addPage();bands(0,4);
  const top=18,bottom=PH-10,colW=(W-8)/2;
  T('Deine Antworten',M,13,14,'bold');T(S.name,PW-M,13,10,'normal',MUT,{align:'right'});
  let size=10,items,cols;
  for(;size>=6.5;size-=0.25){
    const h=lh(size);
    items=S.qs.map((q,i)=>{
      doc.setFont('helvetica','bold');doc.setFontSize(size);
      const ql=doc.splitTextToSize(pdfTxt((i+1)+'. '+q.q),colW);
      doc.setFont('helvetica','normal');
      const al=doc.splitTextToSize(pdfTxt('Deine Antwort: '+S.given[i]+(S.answers[i]?'  (richtig':'  (falsch')+(S.helped[i]?', mit Hilfe)':')')),colW-3);
      const rl=S.answers[i]?[]:doc.splitTextToSize(pdfTxt('Richtig ist: '+q.o[0]),colW-3);
      return {i,ql,al,rl,h:(ql.length+al.length+rl.length)*h+size*0.25};
    });
    const sum=items.reduce((a,b)=>a+b.h,0);let acc=0,split=items.length;
    for(let k=0;k<items.length;k++){if(acc+items[k].h>sum/2+items[k].h/2){split=k;break;}acc+=items[k].h;}
    cols=[items.slice(0,split),items.slice(split)];
    if(cols.every(c=>c.reduce((a,b)=>a+b.h,0)<=bottom-top))break;
  }
  cols.forEach((c,ci)=>{
    let yy=top+lh(size);const x=M+ci*(colW+8);
    c.forEach(it=>{
      const ok=S.answers[it.i];
      it.ql.forEach(l=>{T(l,x,yy,size,'bold');yy+=lh(size);});
      it.al.forEach(l=>{T(l,x+3,yy,size,'normal',ok?OK:BAD);yy+=lh(size);});
      it.rl.forEach(l=>{T(l,x+3,yy,size,'normal');yy+=lh(size);});
      yy+=size*0.25;
    });
  });
  doc.setDrawColor(215,220,228);doc.setLineWidth(0.2);doc.line(M+colW+4,top,M+colW+4,bottom);
  return doc;
}
async function savePdf(){
  const msg=document.getElementById('savemsg');
  const fname='Geometrie-Quiz'+(S.name?'-'+S.name.replace(/[^\wäöüÄÖÜß-]+/g,'_'):'')+'.pdf';
  let dl=null;try{dl=downloadsP?await downloadsP:null;}catch(e){dl=null;}
  if(dl&&window.jspdf){
    try{const blob=buildPdf().output('blob');await dl.save({filename:fname,data:blob});msg.textContent='Die PDF wurde gespeichert.';}
    catch(e){
      if(e&&e.code==='declined'){msg.textContent='Speichern abgebrochen.';return;}
      if(e&&e.code==='rate_limited'){msg.textContent='Bitte kurz warten und noch einmal tippen.';return;}
      printFallback();
    }
    return;
  }
  printFallback();
}
function printFallback(){
  const d=app.querySelector('details.answers');if(d)d.open=true;
  try{window.print();}catch(e){document.getElementById('savemsg').textContent='Speichern ist hier leider nicht möglich.';}
}
intro();
})();
