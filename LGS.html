<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stationenlauf – Lineare Funktionen</title>
<style>
:root{
  --papier:#FCFCFA;
  --karo:#DCE8F1;
  --karo-stark:#A9C4D8;
  --tinte:#132F4C;
  --tinte-hell:#5E7488;
  --tinte-zart:#8A9CAC;
  --richtig:#2C7350;
  --richtig-bg:#EAF4EE;
  --richtig-rand:#A8CDB8;
  --falsch:#B23F30;
  --falsch-bg:#FBECE9;
  --marker:#FBF2D2;
  --marker-rand:#E3C766;
  --rand:#E1E8ED;
  --flaeche:#FFFFFF;
}
*{box-sizing:border-box}
html{scroll-padding-top:118px}
body{
  margin:0;
  background:var(--papier);
  background-image:linear-gradient(var(--karo) 1px,transparent 1px),
                   linear-gradient(90deg,var(--karo) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--tinte);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  font-size:17px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:800px;margin:0 auto;padding:0 22px}

/* ---- Kopf ---- */
.titelzeile{padding:34px 22px 20px;max-width:800px;margin:0 auto}
h1{
  font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
  font-size:1.85rem;font-weight:400;margin:0 0 6px;letter-spacing:-.01em;
}
.untertitel{margin:0;color:var(--tinte-hell);font-size:.95rem}

/* ---- Tableiste ---- */
.tabbar{
  position:sticky;top:0;z-index:20;
  background:rgba(252,252,250,.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rand);
  box-shadow:0 1px 0 rgba(19,47,76,.04);
}
.tabbar-inner{
  max-width:800px;margin:0 auto;padding:0 22px;
  display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
}
.tabbar-inner::-webkit-scrollbar{display:none}
.tab{
  position:relative;flex:0 0 auto;
  font:inherit;font-size:.9rem;
  background:none;border:none;cursor:pointer;
  color:var(--tinte-hell);
  padding:15px 14px 13px;
  display:flex;align-items:baseline;gap:7px;white-space:nowrap;
  border-bottom:2.5px solid transparent;
  transition:color .15s,border-color .15s;
}
.tab:hover{color:var(--tinte)}
.tab[aria-selected="true"]{color:var(--tinte);font-weight:600;border-bottom-color:var(--tinte)}
.tab .zaehler{
  font-size:.75rem;font-variant-numeric:tabular-nums;
  color:var(--tinte-zart);
  background:var(--flaeche);border:1px solid var(--rand);
  border-radius:20px;padding:1px 7px;
}
.tab[aria-selected="true"] .zaehler{border-color:var(--karo-stark);color:var(--tinte-hell)}
.tab.fertig .zaehler{background:var(--richtig-bg);border-color:var(--richtig-rand);color:var(--richtig)}
.tab.fertig[aria-selected="true"]{border-bottom-color:var(--richtig);color:var(--richtig)}

/* ---- Station ---- */
main{padding-bottom:90px}
.station-kopf{
  font-family:Georgia,serif;font-weight:400;
  font-size:1.4rem;margin:32px 0 8px;
}
.station-info{margin:0 0 20px;color:var(--tinte-hell);font-size:.95rem;max-width:60ch}
.merksatz{
  background:var(--marker);
  border:1px solid var(--marker-rand);
  border-radius:2px;
  padding:14px 18px;margin:0 0 26px;
  font-size:.95rem;max-width:60ch;
}
.merksatz .kopf{
  display:block;font-size:.72rem;font-weight:700;
  color:#8A6D14;margin-bottom:3px;
}

/* ---- Niveauwahl ---- */
.niveau{display:inline-flex;margin-bottom:26px;border:1px solid var(--rand);border-radius:4px;overflow:hidden;background:var(--flaeche)}
.niveau button{
  font:inherit;font-size:.87rem;
  background:none;border:none;border-right:1px solid var(--rand);
  padding:9px 17px;cursor:pointer;color:var(--tinte-hell);
  transition:background .13s,color .13s;
}
.niveau button:last-child{border-right:none}
.niveau button:hover{background:#F3F7FA}
.niveau button[aria-pressed="true"]{background:var(--tinte);color:#fff}

/* ---- Aufgabenkarte ---- */
.aufgabe{
  background:var(--flaeche);
  border:1px solid var(--rand);
  border-radius:4px;
  padding:22px 24px;margin-bottom:16px;
  box-shadow:0 1px 2px rgba(19,47,76,.035);
}
.aufgabe.geloest{border-color:var(--richtig-rand);background:var(--richtig-bg)}
.aufgabe .nummer{
  font-size:.74rem;font-weight:700;color:var(--tinte-zart);
  font-variant-numeric:tabular-nums;margin-bottom:9px;
}
.aufgabe.geloest .nummer{color:var(--richtig)}
.frage{margin:0 0 16px}
.hinweiszeile{font-size:.9rem;color:var(--tinte-hell);margin:-8px 0 16px}
.mathe{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:1.08em}
.mathe .zahl{font-style:normal}

/* ---- Wertetabelle ---- */
table.wt{border-collapse:collapse;margin:4px 0 6px;font-size:.97rem}
table.wt th,table.wt td{
  border:1px solid var(--karo-stark);
  padding:7px 12px;text-align:center;min-width:96px;
}
table.wt th{
  background:#F4F8FB;font-weight:600;font-size:.86rem;
  color:var(--tinte-hell);text-align:right;min-width:0;white-space:nowrap;
}
table.wt td.paarzelle{
  font-family:Georgia,serif;color:var(--tinte-zart);
  background:#FAFCFD;letter-spacing:.02em;
}
table.wt td.paarzelle.voll{color:var(--tinte)}
table.wt input{width:80px;margin:0}
table.wt td{padding:5px 10px}

/* ---- Eingaben ---- */
.felder{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:4px}
.feld{display:flex;align-items:center;gap:8px}
.feld label{font-size:.97rem;font-family:Georgia,serif;font-style:italic}
.paar{display:flex;align-items:center;gap:7px}
.paar .klammer{font-family:Georgia,serif;font-size:1.6rem;line-height:1;color:var(--tinte-hell);font-weight:300}
.paar .strich{font-family:Georgia,serif;font-size:1.3rem;color:var(--tinte-zart)}
.paar .name{font-family:Georgia,serif;font-style:italic;font-size:1.08em;margin-right:3px}
.paar .fest{
  font-family:Georgia,serif;font-size:1.05rem;
  padding:8px 12px;background:#F4F8FB;border:1px solid var(--rand);
  border-radius:3px;color:var(--tinte-hell);min-width:60px;text-align:center;
}
input[type=text]{
  font:inherit;font-size:1rem;width:92px;padding:8px 10px;
  border:1px solid var(--karo-stark);border-radius:3px;
  background:var(--papier);color:var(--tinte);text-align:center;
  transition:border-color .13s,box-shadow .13s;
}
input[type=text]:focus{
  outline:none;border-color:var(--tinte);
  box-shadow:0 0 0 3px rgba(19,47,76,.11);background:#fff;
}
.pruef{
  font:inherit;font-size:.9rem;font-weight:600;
  background:var(--tinte);color:#fff;border:none;border-radius:3px;
  padding:9px 20px;cursor:pointer;transition:background .13s;
}
.pruef:hover{background:#1E4670}
.pruef:focus-visible{outline:2px solid var(--tinte);outline-offset:2px}

.vorschau{
  margin-top:16px;padding:11px 15px;background:#F6FAFC;
  border:1px solid var(--rand);border-left:3px solid var(--karo-stark);
  border-radius:2px;font-size:.9rem;color:var(--tinte-hell);
}
.vorschau .gl{font-family:Georgia,serif;font-style:italic;font-size:1.15em;color:var(--tinte);margin-left:4px}
.vorschau .gl .zahl{font-style:normal}

.rueck{margin-top:15px;font-size:.93rem;padding:11px 15px;border-radius:3px;display:none}
.rueck.zeigen{display:block}
.rueck.ok{background:var(--richtig-bg);color:var(--richtig);border:1px solid var(--richtig-rand)}
.rueck.nein{background:var(--falsch-bg);color:var(--falsch);border:1px solid #E8C0B8}
.tipp{margin-top:12px;font-size:.89rem;color:var(--tinte-hell);border-left:2px solid var(--marker-rand);padding-left:13px;display:none}
.tipp.zeigen{display:block}
.tipp-knopf{
  font:inherit;font-size:.85rem;background:none;border:none;
  color:var(--tinte-hell);cursor:pointer;padding:10px 0 2px;text-decoration:underline;
  text-underline-offset:3px;
}
.tipp-knopf:hover{color:var(--tinte)}

/* ---- Koordinatensystem ---- */
svg.kos{
  display:block;max-width:100%;height:auto;margin:8px 0 16px;
  background:#fff;border:1px solid var(--rand);border-radius:3px;
}
svg.kos .gitter{stroke:var(--karo);stroke-width:1}
svg.kos .achse{stroke:var(--tinte);stroke-width:1.6}
svg.kos .beschriftung{font-family:Georgia,serif;font-size:11px;fill:var(--tinte-zart);font-style:normal}
svg.kos .funktion{stroke:var(--tinte);stroke-width:2.4;fill:none}
svg.kos .funktion-b{stroke:var(--falsch);stroke-width:2.4;fill:none}
svg.kos .ziel{fill:transparent;cursor:pointer}
svg.kos .ziel:hover{fill:var(--karo-stark);fill-opacity:.5}
svg.kos .gesetzt{fill:var(--tinte)}
svg.kos .schuelerlinie{stroke:var(--tinte);stroke-width:2.2;stroke-dasharray:7 5;fill:none}
.legende{font-size:.88rem;color:var(--tinte-hell);margin:0 0 14px}
.legende .lb{color:var(--falsch)}
.legende .schluessel{display:inline-block;width:18px;height:2.5px;vertical-align:middle;margin-right:5px;background:var(--tinte)}
.legende .schluessel.b{background:var(--falsch)}

/* ---- Fortschritt ---- */
.fortschritt{
  margin-top:40px;padding:20px 24px;background:var(--flaeche);
  border:1px solid var(--rand);border-radius:4px;font-size:.93rem;
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
}
.fortschritt strong{font-variant-numeric:tabular-nums;font-size:1.15em}
.zuruecksetzen{
  font:inherit;font-size:.85rem;background:none;border:1px solid var(--rand);
  border-radius:3px;color:var(--tinte-hell);cursor:pointer;padding:7px 14px;
}
.zuruecksetzen:hover{border-color:var(--karo-stark);color:var(--tinte)}

@media (max-width:600px){
  html{scroll-padding-top:104px}
  body{font-size:16px}
  .wrap,.tabbar-inner{padding:0 15px}
  .titelzeile{padding:24px 15px 16px}
  h1{font-size:1.5rem}
  .aufgabe{padding:18px 16px}
  input[type=text]{width:78px}
  table.wt th,table.wt td{padding:5px 8px;min-width:78px}
  table.wt input{width:66px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="titelzeile">
  <h1>Stationenlauf: Lineare Funktionen</h1>
  <p class="untertitel">Wiederholung als Grundlage für lineare Gleichungssysteme</p>
</div>

<div class="tabbar">
  <div class="tabbar-inner" id="nav" role="tablist" aria-label="Stationen"></div>
</div>

<main class="wrap">
  <h2 class="station-kopf" id="stationTitel"></h2>
  <p class="station-info" id="stationInfo"></p>
  <div class="merksatz" id="merksatz"></div>
  <div class="niveau" id="niveauLeiste" role="group" aria-label="Niveaustufe wählen"></div>
  <div id="aufgaben"></div>
  <div class="fortschritt">
    <span>Gelöst: <strong id="gesamtStand">0</strong> von <strong id="gesamtAlle">0</strong> Aufgaben</span>
    <button class="zuruecksetzen" id="reset">Alles zurücksetzen</button>
  </div>
</main>

<script>
"use strict";

/* ---------- Zahlen ---------- */
function zahl(text){
  if(text===null||text===undefined) return NaN;
  var t=String(text).trim().replace(/\u2212|\u2013|\u2014/g,"-").replace(/\s/g,"").replace(",",".");
  if(t===""||t==="-") return NaN;
  return Number(t);
}
function gleich(a,b){ return isFinite(a) && Math.abs(a-b)<1e-9; }
function fmt(z){
  var s = Math.abs(z)<1e-9 ? "0" : String(Math.round(z*1e6)/1e6);
  return s.replace(".",",").replace("-","\u2212");
}
function term(m,n){
  var s="";
  if(gleich(m,1)) s="x";
  else if(gleich(m,-1)) s="\u2212x";
  else if(gleich(m,0)) s="";
  else s=fmt(m)+"x";
  if(!gleich(n,0)||s===""){
    if(s!=="") s += n<0 ? " \u2212 " : " + ";
    else if(n<0) s="\u2212";
    s += fmt(Math.abs(n));
  }
  return s;
}
function paar(x,y){ return "(" + fmt(x) + "&#8202;|&#8202;" + fmt(y) + ")"; }

/* ---------- Koordinatensystem ---------- */
var MIN=-6, MAX=6, PX=30, RAND=18;
var GROESSE=(MAX-MIN)*PX + 2*RAND;
function sx(x){ return RAND + (x-MIN)*PX; }
function sy(y){ return RAND + (MAX-y)*PX; }

function kosRahmen(){
  var s='<svg class="kos" viewBox="0 0 '+GROESSE+' '+GROESSE+'" width="'+GROESSE+'" height="'+GROESSE+'" role="img">';
  for(var i=MIN;i<=MAX;i++){
    s+='<line class="gitter" x1="'+sx(i)+'" y1="'+sy(MIN)+'" x2="'+sx(i)+'" y2="'+sy(MAX)+'"/>';
    s+='<line class="gitter" x1="'+sx(MIN)+'" y1="'+sy(i)+'" x2="'+sx(MAX)+'" y2="'+sy(i)+'"/>';
  }
  s+='<line class="achse" x1="'+sx(MIN)+'" y1="'+sy(0)+'" x2="'+sx(MAX)+'" y2="'+sy(0)+'"/>';
  s+='<line class="achse" x1="'+sx(0)+'" y1="'+sy(MIN)+'" x2="'+sx(0)+'" y2="'+sy(MAX)+'"/>';
  for(var j=MIN;j<=MAX;j++){
    if(j===0) continue;
    s+='<text class="beschriftung" x="'+sx(j)+'" y="'+(sy(0)+13)+'" text-anchor="middle">'+fmt(j)+'</text>';
    s+='<text class="beschriftung" x="'+(sx(0)-7)+'" y="'+(sy(j)+4)+'" text-anchor="end">'+fmt(j)+'</text>';
  }
  s+='<text class="beschriftung" x="'+(sx(MAX)-4)+'" y="'+(sy(0)-8)+'" text-anchor="end">x</text>';
  s+='<text class="beschriftung" x="'+(sx(0)+9)+'" y="'+(sy(MAX)+10)+'">y</text>';
  return s;
}
function gerade(m,n,klasse){
  var p=[];
  function inn(v){ return v>=MIN-1e-9 && v<=MAX+1e-9; }
  var yL=m*MIN+n, yR=m*MAX+n;
  if(inn(yL)) p.push([MIN,yL]);
  if(inn(yR)) p.push([MAX,yR]);
  if(Math.abs(m)>1e-9){
    var xU=(MIN-n)/m, xO=(MAX-n)/m;
    if(inn(xU)) p.push([xU,MIN]);
    if(inn(xO)) p.push([xO,MAX]);
  }
  if(p.length<2) return "";
  var a=p[0], z=p[1], best=0;
  for(var i=0;i<p.length;i++) for(var k=i+1;k<p.length;k++){
    var d=Math.hypot(p[i][0]-p[k][0], p[i][1]-p[k][1]);
    if(d>best){ best=d; a=p[i]; z=p[k]; }
  }
  if(best<1e-9) return "";
  return '<line class="'+(klasse||"funktion")+'" x1="'+sx(a[0])+'" y1="'+sy(a[1])+'" x2="'+sx(z[0])+'" y2="'+sy(z[1])+'"/>';
}
function geradeDurch(p1,p2,klasse){
  if(p1[0]===p2[0]){
    return '<line class="'+(klasse||"schuelerlinie")+'" x1="'+sx(p1[0])+'" y1="'+sy(MIN)+'" x2="'+sx(p1[0])+'" y2="'+sy(MAX)+'"/>';
  }
  var m=(p2[1]-p1[1])/(p2[0]-p1[0]);
  return gerade(m, p1[1]-m*p1[0], klasse||"schuelerlinie");
}

/* ---------- Aufgaben ---------- */
var STATIONEN=[
{
  id:"werte", name:"Termwerte",
  titel:"Station 1 – Termwerte einsetzen",
  info:"Fülle die Wertetabelle aus. Jede ausgefüllte Spalte ergibt ein Wertepaar, also auch einen Punkt, der auf der Funktions-Geraden liegt.",
  merksatz:'<span class="kopf">Merke</span><span class="mathe">f&#8202;(x)</span> ist nur ein anderer Name f\u00fcr <span class="mathe">y</span>. Wenn du also <span class="mathe">f&#8202;(x,y)=(4) = 11</span> berechnest, hast du das Wertepaar <span class="mathe">(4&#8202;|&#8202;11)</span> gefunden. Beim Gleichungssystem suchst du sp\u00e4ter genau <em>ein</em> solches Paar \u2013 n\u00e4mlich das, das zu beiden Geraden gleichzeitig passt.',
  niveaus:{
    grund:[
      {typ:"werte", f:"f(x) = 2x + 3", nam:"f", eintraege:[{x:4,y:11},{x:0,y:3},{x:-2,y:-1}]},
      {typ:"werte", f:"g(x) = \u2212x + 5", nam:"g", eintraege:[{x:3,y:2},{x:-1,y:6},{x:5,y:0}]},
      {typ:"werte", f:"h(x) = 4x \u2212 1", nam:"h", eintraege:[{x:2,y:7},{x:0,y:-1},{x:-1,y:-5}]}
    ],
    standard:[
      {typ:"werte", f:"f(x) = 0,5x \u2212 4", nam:"f", eintraege:[{x:6,y:-1},{x:-2,y:-5},{x:3,y:-2.5}]},
      {typ:"werte", f:"g(x) = \u22122x + 1,5", nam:"g", eintraege:[{x:2,y:-2.5},{x:-0.5,y:2.5},{x:0.25,y:1}]},
      {typ:"werte", f:"h(x) = \u22120,25x + 3", nam:"h", eintraege:[{x:8,y:1},{x:-4,y:4},{x:2,y:2.5}]}
    ],
    zusatz:[
      {typ:"umkehr", f:"p(x) = 3x \u2212 7", nam:"p", ziel:8, x:5,
       tipp:"Diesmal ist y bekannt und x gesucht. Setze 8 f\u00fcr p(x) ein und l\u00f6se nach x auf."},
      {typ:"umkehr", f:"q(x) = \u22120,5x + 2", nam:"q", ziel:-1, x:6,
       tipp:"\u22120,5x + 2 = \u22121. Erst \u22122 auf beiden Seiten, dann durch \u22120,5 teilen."},
      {typ:"umkehr", f:"r(x) = 2x + 1", nam:"r", ziel:0, x:-0.5,
       tipp:"Gesucht ist die Nullstelle. Das Ergebnis ist keine ganze Zahl."}
    ]
  }
},
{
  id:"klammern", name:"Klammern",
  titel:"Station 2 – Klammern auflösen",
  info:"Vereinfache jeden Term zur Form ax + b und gib a und b ein. Ohne sicheres Klammerrechnen scheitert später jedes Einsetzungsverfahren.",
  merksatz:'<span class="kopf">Merke</span>Der Faktor vor der Klammer wird mit <em>jedem</em> Summanden in der Klammer multipliziert \u2013 auch mit dem hinteren. Ein Minus vor der Klammer dreht alle Vorzeichen um.',
  niveaus:{
    grund:[
      {typ:"koeff", t:"3(x + 2)", a:3, b:6},
      {typ:"koeff", t:"2(x \u2212 5)", a:2, b:-10},
      {typ:"koeff", t:"\u2212(x + 4)", a:-1, b:-4, tipp:"Vor der Klammer steht \u22121. Beide Vorzeichen drehen sich um."},
      {typ:"koeff", t:"5(2x \u2212 1)", a:10, b:-5}
    ],
    standard:[
      {typ:"koeff", t:"3(x \u2212 4) + 2x", a:5, b:-12},
      {typ:"koeff", t:"4(2x + 1) \u2212 3x", a:5, b:4},
      {typ:"koeff", t:"\u22122(x \u2212 3) + 5", a:-2, b:11, tipp:"\u22122 \u00b7 (\u22123) ergibt +6. Minus mal Minus ist Plus."},
      {typ:"koeff", t:"0,5(6x + 4) \u2212 x", a:2, b:2}
    ],
    zusatz:[
      {typ:"koeff", t:"2(3x \u2212 1) \u2212 3(x + 2)", a:3, b:-8},
      {typ:"koeff", t:"\u2212(4x + 5) + 2(2x \u2212 1)", a:0, b:-7,
       tipp:"Rechne die x-Anteile getrennt: \u22124x + 4x. Was bleibt \u00fcbrig? Gib f\u00fcr a eine 0 ein."},
      {typ:"koeff", t:"0,5(4x \u2212 6) + 2(x + 1,5)", a:4, b:0},
      {typ:"koeff", t:"3(2x + 1) \u2212 2(3x \u2212 4)", a:0, b:11,
       tipp:"Auch hier f\u00e4llt x komplett weg. Das begegnet dir sp\u00e4ter bei Gleichungssystemen ohne L\u00f6sung wieder."}
    ]
  }
},
{
  id:"zeichnen", name:"Zeichnen",
  titel:"Station 3 – Geraden zeichnen",
  info:"Klicke zwei Gitterpunkte an, die auf der Geraden liegen. Die Gerade wird automatisch über das ganze Koordinatensystem verlängert.",
  merksatz:'<span class="kopf">Merke</span>Zwei Punkte legen eine Gerade eindeutig fest. Pr\u00fcfe jeden Punkt, indem du seinen x-Wert in die Gleichung einsetzt \u2013 kommt der y-Wert heraus, liegt er richtig.',
  niveaus:{
    grund:[
      {typ:"zeichnen", m:1, n:2},
      {typ:"zeichnen", m:2, n:-1},
      {typ:"zeichnen", m:-1, n:3}
    ],
    standard:[
      {typ:"zeichnen", m:0.5, n:1, tipp:"Starte bei (0&#8202;|&#8202;1) und gehe 2 nach rechts, 1 nach oben."},
      {typ:"zeichnen", m:-2, n:4},
      {typ:"zeichnen", m:1.5, n:-2, tipp:"Von (0&#8202;|&#8202;\u22122) aus: 2 nach rechts, 3 nach oben."}
    ],
    zusatz:[
      {typ:"zeichnen", m:-0.5, n:2.5,
       tipp:"Das absolute Glied liegt zwischen zwei Gitterpunkten. Suche Punkte mit ungeradem x-Wert, z. B. x = 1."},
      {typ:"zeichnen", m:-1.5, n:3},
      {typ:"zeichnen", m:0, n:-3, tipp:"Der Anstieg ist 0. Wie verl\u00e4uft so eine Gerade?"}
    ]
  }
},
{
  id:"aufstellen", name:"Aufstellen",
  titel:"Station 4 – Funktionsgleichung aufstellen",
  info:"Bestimme den Anstieg m und das absolute Glied n. Unter den Feldern wird deine Gleichung sofort angezeigt – lies sie noch einmal durch, bevor du prüfst.",
  merksatz:'<span class="kopf">Merke</span><span class="mathe">y = mx + n</span>. Der Anstieg <span class="mathe">m</span> sagt, wie steil die Gerade ist; das absolute Glied <span class="mathe">n</span> sagt, wo sie die y-Achse schneidet.',
  niveaus:{
    grund:[
      {typ:"aufstellen", quelle:"graph", m:1, n:2},
      {typ:"aufstellen", quelle:"graph", m:-2, n:-1},
      {typ:"aufstellen", quelle:"graph", m:0.5, n:3}
    ],
    standard:[
      {typ:"aufstellen", quelle:"punkte", p:[0,4], q:[2,0], m:-2, n:4,
       tipp:"m = (y\u2082 \u2212 y\u2081) : (x\u2082 \u2212 x\u2081). Danach einen Punkt einsetzen und nach n aufl\u00f6sen."},
      {typ:"aufstellen", quelle:"punkte", p:[1,3], q:[3,7], m:2, n:1},
      {typ:"aufstellen", quelle:"punkte", p:[-2,5], q:[2,3], m:-0.5, n:4}
    ],
    zusatz:[
      {typ:"aufstellen", quelle:"text", m:0.19, n:1,
       text:"Der E\u2011Scooter-Anbieter <em>Zoom</em> verlangt 1,00 \u20ac Entsperrgeb\u00fchr und 0,19 \u20ac pro Minute. Stelle die Funktion f\u00fcr die Fahrtkosten in Abh\u00e4ngigkeit von der Fahrtdauer x auf.",
       tipp:"Was f\u00e4llt einmalig an? Was pro Minute? Der einmalige Betrag ist n."},
      {typ:"aufstellen", quelle:"text", m:-12, n:300,
       text:"Ein Wassertank enth\u00e4lt 300 Liter. Pro Minute laufen 12 Liter ab. Stelle die Funktion f\u00fcr den Inhalt in Abh\u00e4ngigkeit von der Zeit x auf.",
       tipp:"Der Inhalt nimmt ab. Welches Vorzeichen hat der Anstieg dann?"},
      {typ:"aufstellen", quelle:"text", m:0.09, n:8,
       text:"Ein Handytarif kostet 8 \u20ac Grundgeb\u00fchr im Monat und zus\u00e4tzlich 0,09 \u20ac pro Gespr\u00e4chsminute. Stelle die Funktion f\u00fcr die Monatskosten auf."}
    ]
  }
},
{
  id:"schnitt", name:"Schnittpunkte",
  titel:"Station 5 – Schnittpunkte ablesen",
  info:"Lies den Schnittpunkt beider Geraden ab. Mal wird er als Wertepaar verlangt, mal getrennt nach x und y – gemeint ist beide Male dasselbe.",
  merksatz:'<span class="kopf">Merke</span>Im Schnittpunkt stimmen <em>beide</em> Gleichungen gleichzeitig. Genau dieses eine Wertepaar <span class="mathe">(x&#8202;|&#8202;y)</span> ist sp\u00e4ter die L\u00f6sung eines linearen Gleichungssystems.',
  niveaus:{
    grund:[
      {typ:"schnitt", g1:[1,1], g2:[-1,5], x:2, y:3, paarform:true},
      {typ:"schnitt", g1:[2,0], g2:[1,3], x:3, y:6},
      {typ:"schnitt", g1:[-1,2], g2:[1,-2], x:2, y:0, paarform:true}
    ],
    standard:[
      {typ:"schnitt", g1:[-1,4], g2:[0.5,-2], x:4, y:0},
      {typ:"schnitt", g1:[3,-5], g2:[1,1], x:3, y:4, paarform:true},
      {typ:"schnitt", g1:[0.5,2], g2:[-1,5], x:2, y:3}
    ],
    zusatz:[
      {typ:"schnitt", g1:[1,1], g2:[-1,4], x:1.5, y:2.5, paarform:true,
       tipp:"Der Schnittpunkt liegt nicht auf einem Gitterpunkt. Lies so genau wie m\u00f6glich ab \u2013 halbe K\u00e4stchen sind erlaubt."},
      {typ:"schnitt", g1:[2,-2], g2:[-1,2.5], x:1.5, y:1},
      {typ:"schnitt", g1:[2,1], g2:[2,-3], keiner:true,
       tipp:"Schau dir die beiden Anstiege an. Was bedeutet das f\u00fcr die Lage der Geraden?"}

];

/* ---------- Zustand ---------- */
var geloest={}, punkte={}, aktivStation=0, aktivNiveau={};
STATIONEN.forEach(function(s){ aktivNiveau[s.id]="grund"; });
var NIVEAUS=["grund","standard","zusatz"];
var NIVEAUNAME={grund:"Grundlegend", standard:"Standard", zusatz:"Zusatz"};
function schluessel(sid,niv,i){ return sid+"|"+niv+"|"+i; }

var ALLE=0;
STATIONEN.forEach(function(s){ NIVEAUS.forEach(function(n){ ALLE += s.niveaus[n].length; }); });

/* ---------- Tabs ---------- */
var nav=document.getElementById("nav");

function navBauen(){
  nav.innerHTML="";
  STATIONEN.forEach(function(s,i){
    var ges=0, ok=0;
    NIVEAUS.forEach(function(n){
      s.niveaus[n].forEach(function(_,k){ ges++; if(geloest[schluessel(s.id,n,k)]) ok++; });
    });
    var b=document.createElement("button");
    b.type="button"; b.className="tab"+(ok===ges?" fertig":"");
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", i===aktivStation?"true":"false");
    b.innerHTML=s.name+' <span class="zaehler">'+ok+"/"+ges+"</span>";
    b.addEventListener("click", function(){
      aktivStation=i; zeichnen();
      window.scrollTo({top:0, behavior:"smooth"});
    });
    nav.appendChild(b);
  });
  var summe=0;
  Object.keys(geloest).forEach(function(k){ if(geloest[k]) summe++; });
  document.getElementById("gesamtStand").textContent=summe;
  document.getElementById("gesamtAlle").textContent=ALLE;
}

function zeichnen(){
  var s=STATIONEN[aktivStation];
  document.getElementById("stationTitel").textContent=s.titel;
  document.getElementById("stationInfo").textContent=s.info;
  document.getElementById("merksatz").innerHTML=s.merksatz;

  var nl=document.getElementById("niveauLeiste");
  nl.innerHTML="";
  NIVEAUS.forEach(function(n){
    var b=document.createElement("button");
    b.type="button"; b.textContent=NIVEAUNAME[n];
    b.setAttribute("aria-pressed", aktivNiveau[s.id]===n?"true":"false");
    b.addEventListener("click", function(){ aktivNiveau[s.id]=n; zeichnen(); });
    nl.appendChild(b);
  });

  var ziel=document.getElementById("aufgaben");
  ziel.innerHTML="";
  var niv=aktivNiveau[s.id];
  s.niveaus[niv].forEach(function(a,i){ ziel.appendChild(aufgabeBauen(s.id,niv,i,a)); });
  navBauen();
}

/* ---------- Aufgabenaufbau ---------- */
function aufgabeBauen(sid,niv,i,a){
  var k=schluessel(sid,niv,i);
  var box=document.createElement("div");
  box.className="aufgabe"+(geloest[k]?" geloest":"");

  var koerper='<div class="nummer">Aufgabe '+(i+1)+'</div>';
  var felder=[], erfolg=null, bauart="normal", paarName="", festWert=null;

  if(a.typ==="werte"){
    koerper+='<p class="frage">Gegeben ist <span class="mathe">'+a.f+'</span>. F\u00fclle die Wertetabelle aus.</p>';
    bauart="tabelle";
    a.eintraege.forEach(function(e,j){ felder.push({soll:e.y, id:k+"-"+j, x:e.x}); });
    erfolg="Richtig. Du hast drei Wertepaare gefunden: "
      + a.eintraege.map(function(e){ return paar(e.x,e.y); }).join(", ")
      + ". Alle drei Punkte liegen auf derselben Geraden.";
  }
  else if(a.typ==="umkehr"){
    koerper+='<p class="frage">Gegeben ist <span class="mathe">'+a.f+'</span>. Erg\u00e4nze das fehlende Wertepaar.</p>'
      +'<p class="hinweiszeile">Hier ist der y-Wert vorgegeben \u2013 gesucht ist der passende x-Wert.</p>';
    bauart="paar-x"; paarName="P"; festWert=a.ziel;
    felder.push({soll:a.x, id:k+"-0"});
    erfolg="Richtig. Das Wertepaar lautet "+paar(a.x,a.ziel)+". Diesmal war y gegeben und x gesucht \u2013 die Richtung, die du beim Einsetzungsverfahren oft brauchst.";
  }
  else if(a.typ==="koeff"){
    koerper+='<p class="frage">Vereinfache: <span class="mathe">'+a.t+'</span></p>'
      +'<p class="hinweiszeile">Ergebnis in der Form <span class="mathe">ax + b</span></p>';
    felder.push({label:"a =", soll:a.a, id:k+"-0"});
    felder.push({label:"b =", soll:a.b, id:k+"-1"});
  }
  else if(a.typ==="zeichnen"){
    koerper+='<p class="frage">Zeichne die Gerade <span class="mathe">y = '+term(a.m,a.n)+'</span>, indem du zwei passende Gitterpunkte anklickst.</p>'
      + zeichenFeld(k,a);
  }
  else if(a.typ==="aufstellen"){
    if(a.quelle==="graph"){
      koerper+='<p class="frage">Lies die Gleichung der abgebildeten Geraden ab.</p>'
        +'<svg class="kos" viewBox="0 0 '+GROESSE+' '+GROESSE+'" width="'+GROESSE+'" height="'+GROESSE+'" role="img" aria-label="Koordinatensystem mit einer Geraden">'
        + kosRahmen().replace(/^<svg[^>]*>/,"") + gerade(a.m,a.n) + '</svg>';
    } else if(a.quelle==="punkte"){
      koerper+='<p class="frage">Die Gerade verl\u00e4uft durch <span class="mathe">P&#8202;'+paar(a.p[0],a.p[1])
        +'</span> und <span class="mathe">Q&#8202;'+paar(a.q[0],a.q[1])+'</span>. Bestimme die Gleichung.</p>';
    } else {
      koerper+='<p class="frage">'+a.text+'</p>';
    }
    felder.push({label:"m =", soll:a.m, id:k+"-0"});
    felder.push({label:"n =", soll:a.n, id:k+"-1"});
  }
  else if(a.typ==="schnitt"){
    koerper+='<p class="frage">Lies den Schnittpunkt der beiden Geraden ab.</p>'
      +'<p class="legende"><span class="schluessel"></span><span class="mathe">y = '+term(a.g1[0],a.g1[1])+'</span>'
      +' &nbsp;&nbsp; <span class="lb"><span class="schluessel b"></span><span class="mathe">y = '+term(a.g2[0],a.g2[1])+'</span></span></p>'
      +'<svg class="kos" viewBox="0 0 '+GROESSE+' '+GROESSE+'" width="'+GROESSE+'" height="'+GROESSE+'" role="img" aria-label="Koordinatensystem mit zwei Geraden">'
      + kosRahmen().replace(/^<svg[^>]*>/,"") + gerade(a.g1[0],a.g1[1],"funktion") + gerade(a.g2[0],a.g2[1],"funktion-b") + '</svg>';
    if(a.keiner){
      koerper+='<p class="hinweiszeile">Gibt es keinen Schnittpunkt, schreibe in beide Felder das Wort <em>keiner</em>.</p>';
      felder.push({label:"x =", soll:"keiner", id:k+"-0", wort:true});
      felder.push({label:"y =", soll:"keiner", id:k+"-1", wort:true});
      erfolg="Richtig. Die Geraden sind parallel, sie haben denselben Anstieg. Ein Gleichungssystem aus diesen beiden Gleichungen h\u00e4tte keine L\u00f6sung.";
    } else if(a.paarform){
      koerper+='<p class="hinweiszeile">Gib den Schnittpunkt als Wertepaar an.</p>';
      bauart="paar"; paarName="S";
      felder.push({soll:a.x, id:k+"-0"});
      felder.push({soll:a.y, id:k+"-1"});
      erfolg="Richtig. S&#8202;"+paar(a.x,a.y)+" ist der einzige Punkt, der auf beiden Geraden liegt.";
    } else {
      koerper+='<p class="hinweiszeile">Gib die Koordinaten getrennt an.</p>';
      felder.push({label:"x =", soll:a.x, id:k+"-0"});
      felder.push({label:"y =", soll:a.y, id:k+"-1"});
      erfolg="Richtig. Als Wertepaar geschrieben: S&#8202;"+paar(a.x,a.y)+".";
    }
  }

  box.innerHTML=koerper;

  if(felder.length){
    var reihe=document.createElement("div");
    reihe.className="felder";

    if(bauart==="tabelle"){
      var tab=document.createElement("table");
      tab.className="wt";
      var r1="<tr><th>x</th>", r2="<tr><th>"+a.nam+"&#8202;(x) = y</th>", r3='<tr><th>Wertepaar</th>';
      felder.forEach(function(f){
        r1+="<td>"+fmt(f.x)+"</td>";
        r2+='<td><input type="text" id="'+f.id+'" inputmode="decimal" autocomplete="off" aria-label="y-Wert f\u00fcr x = '+fmt(f.x)+'"></td>';
        r3+='<td class="paarzelle" data-paar="'+f.id+'">('+fmt(f.x)+"&#8202;|&#8202;?)</td>";
      });
      tab.innerHTML=r1+"</tr>"+r2+"</tr>"+r3+"</tr>";
      box.appendChild(tab);
      tab.addEventListener("input", function(){
        felder.forEach(function(f){
          var v=zahl(document.getElementById(f.id).value);
          var z=tab.querySelector('[data-paar="'+f.id+'"]');
          if(isFinite(v)){ z.innerHTML="("+fmt(f.x)+"&#8202;|&#8202;"+fmt(v)+")"; z.classList.add("voll"); }
          else { z.innerHTML="("+fmt(f.x)+"&#8202;|&#8202;?)"; z.classList.remove("voll"); }
        });
      });
    }
    else if(bauart==="paar" || bauart==="paar-x"){
      var gruppe=document.createElement("div");
      gruppe.className="paar";
      gruppe.innerHTML='<span class="name">'+paarName+'</span><span class="klammer">(</span>';
      var i1=document.createElement("input");
      i1.type="text"; i1.id=felder[0].id; i1.inputMode="decimal"; i1.autocomplete="off";
      i1.setAttribute("aria-label","x-Koordinate");
      gruppe.appendChild(i1);
      var strich=document.createElement("span");
      strich.className="strich"; strich.textContent="|";
      gruppe.appendChild(strich);
      if(bauart==="paar-x"){
        var fest=document.createElement("span");
        fest.className="fest"; fest.textContent=fmt(festWert);
        gruppe.appendChild(fest);
      } else {
        var i2=document.createElement("input");
        i2.type="text"; i2.id=felder[1].id; i2.inputMode="decimal"; i2.autocomplete="off";
        i2.setAttribute("aria-label","y-Koordinate");
        gruppe.appendChild(i2);
      }
      var zu=document.createElement("span");
      zu.className="klammer"; zu.textContent=")";
      gruppe.appendChild(zu);
      reihe.appendChild(gruppe);
    }
    else {
      felder.forEach(function(f){
        var w=document.createElement("div");
        w.className="feld";
        var lab=document.createElement("label");
        lab.innerHTML=f.label; lab.setAttribute("for",f.id);
        var inp=document.createElement("input");
        inp.type="text"; inp.id=f.id; inp.autocomplete="off";
        inp.inputMode = f.wort ? "text":"decimal";
        w.appendChild(lab); w.appendChild(inp);
        reihe.appendChild(w);
      });
    }

    var pb=document.createElement("button");
    pb.className="pruef"; pb.type="button"; pb.textContent="Pr\u00fcfen";
    reihe.appendChild(pb);
    box.appendChild(reihe);

    var vorschau=null;
    if(a.typ==="aufstellen"){
      vorschau=document.createElement("div");
      vorschau.className="vorschau";
      box.appendChild(vorschau);
      var aktualisiere=function(){
        var mv=zahl(document.getElementById(k+"-0").value);
        var nv=zahl(document.getElementById(k+"-1").value);
        var txt;
        if(!isFinite(mv)&&!isFinite(nv)) txt="y = m&#8202;x + n";
        else if(!isFinite(mv)) txt="y = m&#8202;x "+(nv<0?"\u2212 ":"+ ")+'<span class="zahl">'+fmt(Math.abs(nv))+"</span>";
        else if(!isFinite(nv)) txt="y = "+'<span class="zahl">'+fmt(mv)+"</span>x + n";
        else txt="y = "+term(mv,nv).replace(/(\u2212?[\d,]+)/g,'<span class="zahl">$1</span>');
        vorschau.innerHTML='Deine Gleichung:<span class="gl">'+txt+'</span>';
      };
      reihe.addEventListener("input", aktualisiere);
      aktualisiere();
    }

    var rueck=document.createElement("div");
    rueck.className="rueck";
    box.appendChild(rueck);

    pb.addEventListener("click", function(){ pruefen(k,felder,rueck,box,erfolg); });
    box.addEventListener("keydown", function(ev){
      if(ev.key==="Enter" && ev.target.tagName==="INPUT"){
        ev.preventDefault(); pruefen(k,felder,rueck,box,erfolg);
      }
    });
  }

  if(a.tipp){
    var tb=document.createElement("button");
    tb.className="tipp-knopf"; tb.type="button"; tb.textContent="Tipp anzeigen";
    var tt=document.createElement("div");
    tt.className="tipp"; tt.innerHTML=a.tipp;
    tb.addEventListener("click", function(){
      tt.classList.toggle("zeigen");
      tb.textContent = tt.classList.contains("zeigen") ? "Tipp ausblenden":"Tipp anzeigen";
    });
    box.appendChild(tb); box.appendChild(tt);
  }

  return box;
}

function pruefen(k,felder,rueck,box,erfolg){
  var alleOk=true, offen=0;
  felder.forEach(function(f){
    var el=document.getElementById(f.id);
    if(!el) return;
    var roh=el.value.trim();
    if(roh===""){ offen++; alleOk=false; el.style.borderColor="var(--karo-stark)"; return; }
    var ok = f.wort
      ? roh.toLowerCase().replace(/[^a-z\u00e4\u00f6\u00fc\u00df]/g,"")==="keiner"
      : gleich(zahl(roh), f.soll);
    el.style.borderColor = ok ? "var(--richtig)":"var(--falsch)";
    if(!ok) alleOk=false;
  });

  rueck.classList.add("zeigen");
  if(offen){
    rueck.className="rueck zeigen nein";
    rueck.textContent="Es sind noch Felder leer.";
    return;
  }
  if(alleOk){
    rueck.className="rueck zeigen ok";
    rueck.innerHTML=erfolg||"Richtig.";
    geloest[k]=true; box.classList.add("geloest");
  } else {
    rueck.className="rueck zeigen nein";
    rueck.textContent="Noch nicht richtig. Die rot umrandeten Felder stimmen nicht \u2013 rechne noch einmal nach.";
    geloest[k]=false; box.classList.remove("geloest");
  }
  navBauen();
}

/* ---------- Zeichenstation ---------- */
function zeichenFeld(k,a){
  var s=kosRahmen().replace(/^<svg([^>]*)>/, '<svg$1 data-key="'+k+'" data-m="'+a.m+'" data-n="'+a.n+'">');
  s=s.replace(/<\/svg>$/,"");
  s+='<g class="schuelerpunkte"></g>';
  for(var x=MIN;x<=MAX;x++) for(var y=MIN;y<=MAX;y++){
    s+='<circle class="ziel" cx="'+sx(x)+'" cy="'+sy(y)+'" r="9" data-x="'+x+'" data-y="'+y+'"></circle>';
  }
  s+='</svg><p class="legende" data-hinweis="'+k+'">Noch kein Punkt gesetzt.</p>';
  return s;
}

document.addEventListener("click", function(ev){
  var t=ev.target;
  if(!t.classList || !t.classList.contains("ziel")) return;
  var svg=t.closest("svg");
  var k=svg.getAttribute("data-key");
  var m=Number(svg.getAttribute("data-m")), n=Number(svg.getAttribute("data-n"));
  var x=Number(t.getAttribute("data-x")), y=Number(t.getAttribute("data-y"));

  if(!punkte[k]) punkte[k]=[];
  var liste=punkte[k], idx=-1;
  for(var i=0;i<liste.length;i++) if(liste[i][0]===x&&liste[i][1]===y) idx=i;
  if(idx>=0) liste.splice(idx,1);
  else { liste.push([x,y]); if(liste.length>2) liste.shift(); }

  var g=svg.querySelector(".schuelerpunkte");
  var inhalt="";
  if(liste.length===2) inhalt += geradeDurch(liste[0],liste[1]);
  liste.forEach(function(p){ inhalt+='<circle class="gesetzt" cx="'+sx(p[0])+'" cy="'+sy(p[1])+'" r="5"/>'; });
  g.innerHTML=inhalt;

  var hinweis=document.querySelector('[data-hinweis="'+k+'"]');
  var box=svg.closest(".aufgabe");
  if(liste.length<2){
    hinweis.textContent = liste.length===0 ? "Noch kein Punkt gesetzt.":"Ein Punkt gesetzt. Setze einen zweiten.";
    hinweis.style.color="var(--tinte-hell)";
    geloest[k]=false; box.classList.remove("geloest");
  } else {
    var falsche=liste.filter(function(p){ return Math.abs(m*p[0]+n-p[1])>1e-9; });
    if(falsche.length===0){
      hinweis.textContent="Richtig. Beide Punkte erf\u00fcllen die Gleichung, die Gerade stimmt.";
      hinweis.style.color="var(--richtig)";
      geloest[k]=true; box.classList.add("geloest");
    } else {
      hinweis.textContent = falsche.length===2
        ? "Beide Punkte liegen nicht auf der Geraden. Setze den x-Wert in die Gleichung ein und pr\u00fcfe den y-Wert."
        : "Ein Punkt liegt nicht auf der Geraden. Klicke ihn noch einmal an, um ihn zu entfernen.";
      hinweis.style.color="var(--falsch)";
      geloest[k]=false; box.classList.remove("geloest");
    }
  }
  navBauen();
});

document.getElementById("reset").addEventListener("click", function(){
  geloest={}; punkte={};
  STATIONEN.forEach(function(s){ aktivNiveau[s.id]="grund"; });
  zeichnen();
});

zeichnen();
</script>
