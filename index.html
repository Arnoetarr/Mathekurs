<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathekurse</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --paper: #fffdf7;
    --grid: #e9e2d0;
    --ink: #241b3a;
    --ink-soft: #6b6280;
    --geo: #0f8b7f;
    --geo-bg: #d8f5ee;
    --lgs: #e0553c;
    --lgs-bg: #ffe4d6;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 24px 80px;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      var(--paper);
    background-size: 26px 26px;
    color: var(--ink);
  }

  header {
    margin-bottom: 48px;
    position: relative;
  }

  h1 {
    font-size: 2.4em;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  h1 span {
    display: inline-block;
  }

  h1 .k1 { color: var(--geo); transform: rotate(-4deg); }
  h1 .k2 { color: var(--lgs); transform: rotate(3deg); }
  h1 .k3 { transform: rotate(-2deg); }

  .stufe {
    margin-bottom: 40px;
  }

  .stufe-kopf {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 14px;
  }

  .stufe-nr {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85em;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
    transform: rotate(-2deg);
  }

  .geo .stufe-nr { background: var(--geo); color: #fff; }
  .lgs .stufe-nr { background: var(--lgs); color: #fff; }

  h2 {
    font-size: 1.05em;
    font-weight: 600;
    margin: 0;
    color: var(--ink-soft);
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li + li { margin-top: 12px; }

  a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 12px;
    text-decoration: none;
    color: var(--ink);
    font-weight: 600;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  }

  .geo a { box-shadow: 5px 5px 0 var(--geo); }
  .lgs a { box-shadow: 5px 5px 0 var(--lgs); }

  li:nth-child(odd) a { transform: rotate(-0.6deg); }
  li:nth-child(even) a { transform: rotate(0.6deg); }

  .geo a:hover { background: var(--geo-bg); transform: translate(2px, 2px) rotate(0deg); box-shadow: 2px 2px 0 var(--geo); }
  .lgs a:hover { background: var(--lgs-bg); transform: translate(2px, 2px) rotate(0deg); box-shadow: 2px 2px 0 var(--lgs); }

  a::after {
    content: "→";
    font-family: 'IBM Plex Mono', monospace;
    flex-shrink: 0;
  }

  .geo a::after { color: var(--geo); }
  .lgs a::after { color: var(--lgs); }

  @media (prefers-reduced-motion: reduce) {
    a { transition: none; }
  }
</style>
</head>
<body>

<header>
  <h1><span class="k1">Kurve.</span> <span class="k2">Winkel.</span> <span class="k3">Los.</span></h1>
</header>

<section class="stufe geo">
  <div class="stufe-kopf">
    <span class="stufe-nr">5/6</span>
    <h2>Geometrie</h2>
  </div>
  <ul>
    <li><a href="Schatzsuche.html">Koordinatensystem-Schatzsuche</a></li>
    <li><a href="Winkel.html">Winkel</a></li>
  </ul>
</section>

<section class="stufe lgs">
  <div class="stufe-kopf">
    <span class="stufe-nr">9/10</span>
    <h2>Lineare Gleichungssysteme</h2>
  </div>
  <ul>
    <li><a href="LGS.html">Stationen zur Wiederholung</a></li>
  </ul>
</section>

</body>
</html>
