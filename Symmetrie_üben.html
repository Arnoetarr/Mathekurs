<style>
:root{
  --page:#e9eff4; --paper:#fdfeff; --tab-bg:#dde6ee;
  --grid:#cadcec; --grid-strong:#9dbad3;
  --text:#22262c; --muted:#56606b;
  --fig-line:#2e333a; --fig-fill:#d3dde7; --cell-orig:#6f7a86;
  --ink:#1f4fc4; --on-ink:#ffffff; --ink-fill:rgba(31,79,196,.28);
  --axis:#c2185b;
  --ok:#1b7a44; --ok-fill:rgba(27,122,68,.18);
  --bad:#c9480c; --bad-fill:rgba(201,72,12,.16);
  --btn:#ffffff; --btn-border:#b5c4d2;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#11151a; --paper:#1a2028; --tab-bg:#151a20;
    --grid:#2a3845; --grid-strong:#3e5467;
    --text:#e6ebf0; --muted:#9ba7b3;
    --fig-line:#dfe5ea; --fig-fill:#33414f; --cell-orig:#8f9aa6;
    --ink:#80a6ff; --on-ink:#0c1320; --ink-fill:rgba(128,166,255,.3);
    --axis:#ff72a8;
    --ok:#52c985; --ok-fill:rgba(82,201,133,.2);
    --bad:#ff8f52; --bad-fill:rgba(255,143,82,.2);
    --btn:#212933; --btn-border:#3b4856;
  }
}
:root[data-theme="dark"]{
  --page:#11151a; --paper:#1a2028; --tab-bg:#151a20;
  --grid:#2a3845; --grid-strong:#3e5467;
  --text:#e6ebf0; --muted:#9ba7b3;
  --fig-line:#dfe5ea; --fig-fill:#33414f; --cell-orig:#8f9aa6;
  --ink:#80a6ff; --on-ink:#0c1320; --ink-fill:rgba(128,166,255,.3);
  --axis:#ff72a8;
  --ok:#52c985; --ok-fill:rgba(82,201,133,.2);
  --bad:#ff8f52; --bad-fill:rgba(255,143,82,.2);
  --btn:#212933; --btn-border:#3b4856;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--text);
  font-family:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  font-size:1.0625rem;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:1.25rem 1rem 2.5rem}
header h1{font-size:2.2rem;line-height:1.1;margin:0}
header p{margin:.3rem 0 1.1rem;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:.3rem;position:relative;z-index:1}
.tab{font:inherit;font-weight:700;color:var(--muted);background:var(--tab-bg);
  border:1.5px solid var(--btn-border);border-bottom:none;border-radius:12px 12px 0 0;
  padding:.5rem 1rem;min-height:44px;margin-bottom:-1.5px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--paper);color:var(--text)}
@media (max-width:560px){.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tab{flex:0 0 auto;padding:.5rem .7rem;font-size:.95rem}.sheet{padding:1rem .8rem}}
.sheet{background:var(--paper);border:1.5px solid var(--btn-border);
  border-radius:0 14px 14px 14px;padding:1.25rem}
.work{display:grid;gap:1rem 2rem;grid-template-areas:"task" "board" "controls"}
@media (min-width:860px){
  .work{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);
    grid-template-areas:"task board" "controls board";grid-template-rows:auto 1fr;align-items:start}
}
#task{grid-area:task} #controls{grid-area:controls} .board-wrap{grid-area:board}
#task h2{font-size:1.45rem;line-height:1.2;margin:0 0 .4rem}
#task p{margin:.3rem 0;max-width:60ch}
.small{font-size:.92rem;color:var(--muted)}
#board{display:block;width:100%;max-width:580px;height:auto;aspect-ratio:1/1;margin:0 auto;
  border-radius:8px;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:crosshair}
.btn{font:inherit;color:var(--text);background:var(--btn);border:1.5px solid var(--btn-border);
  border-radius:10px;padding:.45rem .95rem;min-height:44px;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:700}
.btn.picked-bad{background:var(--bad-fill);border-color:var(--bad)}
.btn.picked-ok{background:var(--ok-fill);border-color:var(--ok);font-weight:700}
.btn:disabled{opacity:.55;cursor:default}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.settings{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;margin:0 0 .6rem}
.settings label{display:flex;flex-direction:column;font-size:.92rem;color:var(--muted)}
select{font:inherit;color:var(--text);background:var(--btn);border:1.5px solid var(--btn-border);
  border-radius:8px;padding:.35rem .5rem;min-height:44px}
.fb{min-height:3.2rem;margin:.75rem 0;padding:.6rem .85rem;border-radius:10px;border-left:4px solid transparent}
.fb.ok{background:var(--ok-fill);border-color:var(--ok)}
.fb.bad{background:var(--bad-fill);border-color:var(--bad)}
.fb.info{background:var(--tab-bg);border-color:var(--grid-strong)}
.counter{font-weight:700;margin:.4rem 0}
.stats{color:var(--muted);font-size:.92rem;margin:.4rem 0}
details{border:1.5px dashed var(--grid-strong);border-radius:10px;padding:.45rem .9rem;margin-top:.8rem}
summary{font-weight:700;cursor:pointer}
details p{margin:.45rem 0;max-width:60ch}
.ov{text-decoration:overline}

/* SVG */
.paper{fill:var(--paper)}
.gl{stroke:var(--grid);stroke-width:.03}
.fig{fill:var(--fig-fill);stroke:var(--fig-line);stroke-width:.09;stroke-linejoin:round}
.axis{stroke:var(--axis);stroke-width:.09;stroke-dasharray:.6 .2 .1 .2;stroke-linecap:round;fill:none}
.axis.hint{opacity:.5}
.wrongline{stroke:var(--bad);stroke-width:.08;stroke-dasharray:.25 .2;fill:none}
.zdot{fill:var(--axis)}
.zlbl{fill:var(--axis);font-size:.62px;font-weight:700}
.mark{fill:var(--ink)}
.ghost{fill:none;stroke:var(--ink);stroke-width:.06;opacity:.7;pointer-events:none}
.lbl{fill:var(--text);font-size:.58px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.lbl.ink{fill:var(--ink)} .lbl.ok{fill:var(--ok)} .lbl.bad{fill:var(--bad)}
.cell-orig{fill:var(--cell-orig)}
.cell-ink{fill:var(--ink-fill);stroke:var(--ink);stroke-width:.06}
.cell-ok{fill:var(--ok-fill);stroke:var(--ok);stroke-width:.08}
.cell-bad{fill:var(--bad-fill);stroke:var(--bad);stroke-width:.08}
.cell-sol{fill:none;stroke:var(--ok);stroke-width:.07;stroke-dasharray:.18 .12}
.inkpoly{fill:var(--ink-fill);stroke:var(--ink);stroke-width:.08;stroke-linejoin:round}
.pt{fill:var(--fig-line)} .pt-ink{fill:var(--ink)} .pt-ok{fill:var(--ok)} .pt-bad{fill:var(--bad)}
.pt-sol{fill:none;stroke:var(--ok);stroke-width:.08}
.conn{stroke:var(--muted);stroke-width:.05;stroke-dasharray:.15 .12}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Symmetrie</h1>
    <p>Figuren untersuchen, Achsen einzeichnen, spiegeln</p>
  </header>
  <nav class="tabs" role="tablist" aria-label="Übungen">
    <button class="tab" role="tab" data-mode="erkennen">Erkennen</button>
    <button class="tab" role="tab" data-mode="achsen">Achsen finden</button>
    <button class="tab" role="tab" data-mode="kaestchen">Kästchen spiegeln</button>
    <button class="tab" role="tab" data-mode="punkte">Punkte und Figuren spiegeln</button>
  </nav>
  <main class="sheet">
    <div class="work">
      <section id="task"></section>
      <div class="board-wrap"><svg id="board" xmlns="http://www.w3.org/2000/svg" aria-label="Karopapier mit Aufgabe"></svg></div>
      <section id="controls"></section>
    </div>
  </main>
</div>

<script>
(function(){
"use strict";
// ---------- Geometrie ----------
//GEO-START
const K=(x,y)=>Math.round(x*1000)+','+Math.round(y*1000);
function edgeSet(polys){
  const s=new Set();
  for(const p of polys){
    for(let i=0;i<p.length;i++){
      const a=p[i],b=p[(i+1)%p.length];
      const ka=K(a[0],a[1]),kb=K(b[0],b[1]);
      s.add(ka<kb?ka+'|'+kb:kb+'|'+ka);
    }
  }
  return s;
}
function symUnder(polys,f){
  const A=edgeSet(polys),B=edgeSet(polys.map(p=>p.map(f)));
  if(A.size!==B.size) return false;
  for(const e of A) if(!B.has(e)) return false;
  return true;
}
function reflLine(a,b){
  const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;
  return p=>{const t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L;
    const fx=a[0]+t*dx,fy=a[1]+t*dy;return [2*fx-p[0],2*fy-p[1]];};
}
const reflPoint=z=>p=>[2*z[0]-p[0],2*z[1]-p[1]];
function centerOf(polys){let sx=0,sy=0,n=0;for(const p of polys)for(const v of p){sx+=v[0];sy+=v[1];n++;}return [sx/n,sy/n];}
function isPointSym(polys){return symUnder(polys,reflPoint(centerOf(polys)));}
function findAxes(polys,N){
  const axes=[];const t=(a,b)=>{if(symUnder(polys,reflLine(a,b)))axes.push([a,b]);};
  for(let c=0;c<=N;c+=0.5){t([c,0],[c,N]);t([0,c],[N,c]);}
  for(let c=-N;c<=N;c++) t([0,c],[N,N+c]);
  for(let c=0;c<=2*N;c++) t([0,c],[N,c-N]);
  return axes;
}
function lineKey(a,b){
  let dx=b[0]-a[0],dy=b[1]-a[1];const L=Math.hypot(dx,dy);dx/=L;dy/=L;
  if(dx<-1e-9||(Math.abs(dx)<1e-9&&dy<0)){dx=-dx;dy=-dy;}
  const c=-dy*a[0]+dx*a[1];
  return Math.round(dx*1000)+','+Math.round(dy*1000)+','+Math.round(c*100);
}
const BASE=[
  {n:'Quadrat',p:[[[0,0],[4,0],[4,4],[0,4]]]},
  {n:'Quadrat auf der Spitze',p:[[[2,0],[4,2],[2,4],[0,2]]]},
  {n:'Rechteck',p:[[[0,0],[6,0],[6,3],[0,3]]]},
  {n:'Raute',p:[[[3,0],[6,4],[3,8],[0,4]]]},
  {n:'Plus',p:[[[2,0],[4,0],[4,2],[6,2],[6,4],[4,4],[4,6],[2,6],[2,4],[0,4],[0,2],[2,2]]]},
  {n:'Achteck',p:[[[1,0],[3,0],[4,1],[4,3],[3,4],[1,4],[0,3],[0,1]]]},
  {n:'Sechseck',p:[[[1,0],[3,0],[4,2],[3,4],[1,4],[0,2]]]},
  {n:'gleichschenkliges Dreieck',p:[[[0,5],[6,5],[3,0]]]},
  {n:'Drachenviereck',p:[[[3,0],[6,2],[3,8],[0,2]]]},
  {n:'Trapez',p:[[[2,0],[5,0],[7,4],[0,4]]]},
  {n:'Pfeil',p:[[[0,2],[4,2],[4,0],[7,3],[4,6],[4,4],[0,4]]]},
  {n:'L-Form',p:[[[0,0],[1,0],[1,3],[4,3],[4,4],[0,4]]]},
  {n:'T-Form',p:[[[0,0],[6,0],[6,2],[4,2],[4,7],[2,7],[2,2],[0,2]]]},
  {n:'Haus',p:[[[0,3],[3,0],[6,3],[6,8],[0,8]]]},
  {n:'Fahne',p:[[[0,0],[6,0],[4,2],[6,4],[0,4]]]},
  {n:'Parallelogramm',p:[[[2,0],[7,0],[5,4],[0,4]]]},
  {n:'S-Form',p:[[[1,0],[3,0],[3,1],[2,1],[2,2],[0,2],[0,1],[1,1]]]},
  {n:'Windrad',p:[[[2,2],[2,0],[4,0]],[[2,2],[4,2],[4,4]],[[2,2],[2,4],[0,4]],[[2,2],[0,2],[0,0]]]},
  {n:'Dreieck',p:[[[0,5],[7,5],[2,0]]]},
  {n:'schiefes Trapez',p:[[[1,0],[4,0],[7,4],[0,4]]]},
  {n:'Blitz',p:[[[3,0],[6,0],[4,3],[6,3],[1,9],[2,4],[0,4]]]},
  {n:'Viereck',p:[[[0,0],[5,1],[4,5],[1,3]]]}
];
const ISOS=[p=>[p[0],p[1]],p=>[-p[1],p[0]],p=>[-p[0],-p[1]],p=>[p[1],-p[0]],
            p=>[-p[0],p[1]],p=>[p[0],-p[1]],p=>[p[1],p[0]],p=>[-p[1],-p[0]]];
function place(shape,N,iso){
  const polys=shape.p.map(poly=>poly.map(iso));
  const xs=[],ys=[];polys.forEach(q=>q.forEach(v=>{xs.push(v[0]);ys.push(v[1]);}));
  const minx=Math.min(...xs),miny=Math.min(...ys);
  const w=Math.max(...xs)-minx,h=Math.max(...ys)-miny;
  const s=Math.max(w,h)<=5?2:1;
  const tx=Math.floor((N-w*s)/2),ty=Math.floor((N-h*s)/2);
  return polys.map(q=>q.map(v=>[(v[0]-minx)*s+tx,(v[1]-miny)*s+ty]));
}
BASE.forEach(s=>{
  const polys=place(s,12,ISOS[0]);
  s.nAx=findAxes(polys,12).length;s.pt=isPointSym(polys);
  s.cat=s.nAx>0&&s.pt?'beides':s.nAx>0?'achse':s.pt?'punkt':'keins';
});
//GEO-END

// ---------- Hilfen ----------
const NS='http://www.w3.org/2000/svg';
const board=document.getElementById('board');
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const PR='\u2032';
function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||board).appendChild(e);return e;}
function txt(s,x,y,cls){const t=mk('text',{x:x,y:y,class:cls});t.textContent=s;return t;}
const pathD=poly=>'M'+poly.map(v=>v[0]+' '+v[1]).join(' L')+' Z';
function setupBoard(N,pad){
  board.innerHTML='';
  board.setAttribute('viewBox',(-pad)+' '+(-pad)+' '+(N+2*pad)+' '+(N+2*pad));
  mk('rect',{x:-pad,y:-pad,width:N+2*pad,height:N+2*pad,class:'paper'});
  for(let i=0;i<=N;i++){
    mk('line',{x1:i,y1:-pad,x2:i,y2:N+pad,class:'gl'});
    mk('line',{x1:-pad,y1:i,x2:N+pad,y2:i,class:'gl'});
  }
}
function drawLine(a,b,cls){
  const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
  mk('line',{x1:a[0]-ux*40,y1:a[1]-uy*40,x2:a[0]+ux*40,y2:a[1]+uy*40,class:cls});
}
function drawZ(z){mk('circle',{cx:z[0],cy:z[1],r:.17,class:'zdot'});txt('Z',z[0]+.42,z[1]-.42,'zlbl');}
let ghost=null;
function addGhost(){ghost=mk('circle',{cx:-9,cy:-9,r:.22,class:'ghost'});}
function svgPt(e){const p=board.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(board.getScreenCTM().inverse());}
function joinDe(a){return a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' und '+a[a.length-1];}
function labelPos(v,c,N){
  let dx=v[0]-c[0],dy=v[1]-c[1];const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
  return [Math.min(N+.25,Math.max(-.25,v[0]+dx*.6)),Math.min(N+.25,Math.max(-.25,v[1]+dy*.6))];
}
const centroid=pts=>[pts.reduce((s,p)=>s+p[0],0)/pts.length,pts.reduce((s,p)=>s+p[1],0)/pts.length];

const stats={erkennen:{r:0,t:0},achsen:{r:0,t:0},kaestchen:{r:0,t:0},punkte:{r:0,t:0}};
function countTask(key,m,ok){if(m.counted)return;m.counted=true;stats[key].t++;if(ok&&m.mistakes===0)stats[key].r++;}
function statsLine(key){const s=stats[key];return s.t===0?'':'Ohne Fehler gelöst: '+s.r+' von '+s.t+' Aufgaben';}
function showFb(m){const f=$('fb');if(!f)return;const fb=m.fb||{type:'',html:''};f.className='fb'+(fb.type?' '+fb.type:'');f.innerHTML=fb.html;}

const MERKE_SYM='<details><summary>Merke</summary>'+
 '<p><b>Achsensymmetrisch</b>: Man kann die Figur so falten, dass beide Hälften genau aufeinanderpassen. Die Faltlinie heißt Symmetrieachse.</p>'+
 '<p><b>Punktsymmetrisch</b>: Man kann die Figur um einen Punkt Z eine halbe Umdrehung drehen. Danach passt sie genau auf sich selbst. Z heißt Symmetriepunkt.</p></details>';
const MERKE_ACHSE='<details><summary>Merke</summary>'+
 '<p><b>Symmetrieachse</b>: Faltet man die Figur an dieser Geraden, passen beide Hälften genau aufeinander.</p>'+
 '<p>Eine Figur kann keine, eine oder mehrere Symmetrieachsen haben.</p></details>';
const MERKE_SPIEGEL='<details><summary>Merke</summary>'+
 '<p><b>Spiegeln an einer Achse</b>: Zu jedem Originalpunkt A gehört ein Bildpunkt A'+PR+' auf der anderen Seite. A und A'+PR+' sind gleich weit von der Spiegelachse entfernt. Die Strecke <span class="ov">AA'+PR+'</span> steht senkrecht zur Spiegelachse.</p>'+
 '</details>';

const MERKE_ACHSSPIEGEL='<details><summary>Merke</summary>'+
 '<p><b>Spiegeln an einer Achse</b>: Jedes Kästchen hat auf der anderen Seite ein Spiegelkästchen. Beide sind gleich weit von der Spiegelachse entfernt.</p>'+
 '<p>Die Figur und ihr Spiegelbild sind zusammen achsensymmetrisch. Die Spiegelachse ist ihre Symmetrieachse.</p></details>';
const state={mode:'erkennen',m1:null,m2:null,m3:null,m4:null,
  cfg3:{art:'gemischt',level:'leicht'},cfg4:{art:'gemischt',level:'leicht'}};

// ---------- 1 Erkennen ----------
const M1={
  mount(){
    $('task').innerHTML='<h2>Welche Symmetrie hat die Figur?</h2>'+
      '<p>Stell dir vor, du faltest die Figur an einer Geraden. Oder du drehst sie eine halbe Umdrehung um einen Punkt. Passt sie danach genau auf sich selbst?</p>';
    $('controls').innerHTML='<div class="answers" role="group" aria-label="Antworten">'+
      '<button class="btn ans" data-c="achse">nur achsensymmetrisch</button>'+
      '<button class="btn ans" data-c="punkt">nur punktsymmetrisch</button>'+
      '<button class="btn ans" data-c="beides">achsen- und punktsymmetrisch</button>'+
      '<button class="btn ans" data-c="keins">weder noch</button></div>'+
      '<div id="fb" class="fb" role="status" aria-live="polite"></div>'+
      '<div class="row"><button class="btn" id="solve">Lösung zeigen</button><button class="btn primary" id="next">Nächste Figur</button></div>'+
      '<p class="stats" id="stats"></p>'+MERKE_SYM;
    document.querySelectorAll('.ans').forEach(b=>b.addEventListener('click',()=>this.answer(b.dataset.c)));
    $('solve').addEventListener('click',()=>this.solve());
    $('next').addEventListener('click',()=>this.newTask());
    if(!state.m1) this.newTask(); else {this.draw();this.ui();}
  },
  newTask(){
    const prev=state.m1&&state.m1.name;let s;
    do{s=pick(BASE.filter(b=>b.cat===pick(['beides','achse','punkt','keins'])))}while(!s||s.n===prev);
    const polys=place(s,12,pick(ISOS));
    state.m1={name:s.n,polys,axes:findAxes(polys,12),z:s.pt?centerOf(polys):null,cat:s.cat,
      picked:[],solved:false,reveal:false,mistakes:0,fb:null};
    this.draw();this.ui();
  },
  describe(m){
    const n=m.axes.length;
    const a=n===0?'keine Symmetrieachse':n===1?'eine Symmetrieachse':n+' Symmetrieachsen';
    return 'Die Figur hat '+a+(m.z?' und einen Symmetriepunkt Z.':' und keinen Symmetriepunkt.');
  },
  answer(c){
    const m=state.m1;if(m.solved)return;
    m.picked.push(c);
    if(c===m.cat){m.solved=true;m.reveal=true;countTask('erkennen',m,true);
      m.fb={type:'ok',html:'<b>Richtig!</b> '+this.describe(m)};}
    else{m.mistakes++;
      m.fb={type:'bad',html:'<b>Das stimmt noch nicht.</b> Prüfe beides: Kannst du die Figur falten? Passt sie nach einer halben Drehung wieder auf sich?'};}
    this.draw();this.ui();
  },
  solve(){const m=state.m1;if(m.solved)return;m.solved=true;m.reveal=true;countTask('erkennen',m,false);
    m.fb={type:'info',html:this.describe(m)};this.draw();this.ui();},
  ui(){
    const m=state.m1;
    document.querySelectorAll('.ans').forEach(b=>{

const M3T={
  senkrecht:{map:(i,j)=>[9-i,j],region:(i,j)=>i<5,near:(i,j)=>i===4,line:[[5,0],[5,10]]},
  waagerecht:{map:(i,j)=>[i,9-j],region:(i,j)=>j<5,near:(i,j)=>j===4,line:[[0,5],[10,5]]},
  schraeg1:{map:(i,j)=>[j,i],region:(i,j)=>j>i,near:(i,j)=>j===i+1,line:[[0,0],[10,10]]},
  schraeg2:{map:(i,j)=>[9-j,9-i],region:(i,j)=>i+j<9,near:(i,j)=>i+j===8,line:[[0,10],[10,0]]},
};
function blob(T,size,easy){
  const starts=[];
  for(let i=0;i<10;i++)for(let j=0;j<10;j++) if(T.region(i,j)&&(!easy||T.near(i,j))) starts.push([i,j]);
  for(let tries=0;tries<300;tries++){
    const cells=new Set([pick(starts).join(',')]);let g=0;
    while(cells.size<size&&g++<600){
      const c=pick([...cells]).split(',').map(Number);const d=pick([[1,0],[-1,0],[0,1],[0,-1]]);
      const n=[c[0]+d[0],c[1]+d[1]];
      if(n[0]<0||n[0]>9||n[1]<0||n[1]>9||!T.region(n[0],n[1]))continue;
      cells.add(n.join(','));
    }
    if(cells.size===size) return [...cells].map(k=>k.split(',').map(Number));
  }
  return null;
}

// ---------- 4 Punkte spiegeln ----------
function m4Type(t){
  const N=12;
  if(t==='senkrecht')return{map:p=>[N-p[0],p[1]],ok:p=>p[0]<6,dist:p=>6-p[0],line:[[6,0],[6,N]]};
  if(t==='waagerecht')return{map:p=>[p[0],N-p[1]],ok:p=>p[1]<6,dist:p=>6-p[1],line:[[0,6],[N,6]]};
  if(t==='schraeg1')return{map:p=>[p[1],p[0]],ok:p=>p[1]>p[0],dist:p=>Math.ceil((p[1]-p[0])/2),line:[[0,0],[N,N]]};
  if(t==='schraeg2')return{map:p=>[N-p[1],N-p[0]],ok:p=>p[0]+p[1]<N,dist:p=>Math.ceil((N-p[0]-p[1])/2),line:[[0,N],[N,0]]};
  const z=[rnd(5,7),rnd(5,7)];
  return{z,map:p=>[2*z[0]-p[0],2*z[1]-p[1]],ok:p=>p[0]<z[0],dist:p=>Math.max(Math.abs(p[0]-z[0]),Math.abs(p[1]-z[1]))};
}
const area=pts=>Math.abs(pts.reduce((s,p,i)=>{const q=pts[(i+1)%pts.length];return s+p[0]*q[1]-q[0]*p[1];},0))/2;
const LETTERS=['A','B','C','D','E','F'];
const M4={
  mount(){
    $('task').innerHTML='<h2>Punkte und Figuren spiegeln</h2><p id="instr"></p><p class="counter" id="next-pt"></p>';

      '<div class="row"><button class="btn primary" id="check">Prüfen</button><button class="btn" id="solve">Lösung zeigen</button><button class="btn" id="next">Neue Aufgabe</button></div>'+
      '<p class="small">Tippe auf einen gesetzten Punkt, um ihn wieder zu löschen.</p>'+
      '<p class="stats" id="stats"></p>'+
      '<details><summary>Tipp</summary><p>An einer Achse: Geh von A aus im rechten Winkel auf die Spiegelachse zu. Zähle die Kästchen. Auf der anderen Seite gehst du genauso weit weiter. Dort liegt A'+PR+'.</p>'+
      '<p>Bei einer Figur spiegelst du zuerst alle Eckpunkte. Dann verbindest du die Bildpunkte in der gleichen Reihenfolge.</p></details>'+MERKE_SPIEGEL;
    $('level').addEventListener('change',e=>{state.cfg4.level=e.target.value;this.newTask();});
    $('check').addEventListener('click',()=>this.check());
    $('solve').addEventListener('click',()=>this.solve());
    $('next').addEventListener('click',()=>this.newTask());

  },
  newTask(){
    const lv=state.cfg4.level,t=pick(M3LEVEL[lv]),T=m4Type(t);
    const isPts=lv==='leicht';
    const kind=lv==='mittel'?pick(['quadrat','rechteck','dreieck']):'frei';
    const n=lv==='leicht'?1:lv==='mittel'?(kind==='dreieck'?3:4):rnd(4,6);
    const maxD=lv==='leicht'?3:lv==='mittel'?5:6;
    let pts=null;
    const valid=p=>{if(!T.ok(p))return false;const d=T.dist(p);if(d<1||d>maxD)return false;
      const im=T.map(p);return p[0]>=0&&p[0]<=12&&p[1]>=0&&p[1]<=12&&im[0]>=0&&im[0]<=12&&im[1]>=0&&im[1]<=12;};
    if(kind==='quadrat'||kind==='rechteck'){
      for(let tries=0;tries<3000&&!pts;tries++){
        const w=kind==='quadrat'?rnd(2,4):rnd(2,5),h=kind==='quadrat'?w:rnd(2,5);
        if(kind==='rechteck'&&h===w)continue;
        const x=rnd(0,12),y=rnd(0,12);
        const c=[[x,y+h],[x+w,y+h],[x+w,y],[x,y]];
        if(c.every(valid))pts=c;
      }
    }
    for(let tries=0;tries<2000&&!pts;tries++){
      const cand=[];let g=0;
      while(cand.length<n&&g++<400){
        const p=[rnd(0,12),rnd(0,12)];if(!T.ok(p))continue;
        const d=T.dist(p);if(d<1||d>maxD)continue;
        const im=T.map(p);if(im[0]<0||im[0]>12||im[1]<0||im[1]>12)continue;
        if(cand.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<2))continue;
        cand.push(p);
      }
      if(cand.length<n)continue;
      const c=centroid(cand);
      cand.sort((a,b)=>Math.atan2(b[1]-c[1],b[0]-c[0])-Math.atan2(a[1]-c[1],a[0]-c[0]));
      if(!isPts&&area(cand)<n*2.5)continue;
      pts=cand;

  },

  check(){

        :'Jede gestrichelte Verbindungsstrecke steht senkrecht zur Spiegelachse. Die Achse halbiert sie.')};
    }else{
      m.mistakes++;m.checked=true;
      m.fb={type:'bad',html:joinDe(wrong)+(wrong.length===1?' liegt':' liegen')+' noch nicht richtig (orange). Tippe darauf, um den Punkt zu löschen und neu zu setzen.'};
    }
    this.draw();this.ui();
  },
  solve(){const m=state.m4;if(m.solved)return;m.solved=true;m.reveal=true;countTask('punkte',m,false);
    m.fb={type:'info',html:'Die grünen Kreise zeigen, wo die Bildpunkte liegen.'};this.draw();this.ui();},

    $('instr').textContent='Spiegle '+fig+' an der Spiegelachse.'+(m.isPts?(n===1?' Setze den Bildpunkt A'+PR+'.':' Setze die Bildpunkte.'):' Setze die Bildpunkte der Ecken.');

    if(!m.isPts) mk('path',{d:pathD(m.orig),class:'fig'});
    let co=centroid(m.orig),ct=centroid(m.target);
    if(m.orig.length===1){co=m.target[0];ct=m.orig[0];}
    if(m.solved) m.orig.forEach((p,i)=>mk('line',{x1:p[0],y1:p[1],x2:m.target[i][0],y2:m.target[i][1],class:'conn'}));
    m.orig.forEach((p,i)=>{mk('circle',{cx:p[0],cy:p[1],r:.14,class:'pt'});const l=labelPos(p,co,N);txt(LETTERS[i],l[0],l[1],'lbl');});
    if(!m.isPts&&m.placed.every(Boolean)) mk('path',{d:pathD(m.placed),class:'inkpoly'});
    if(m.reveal) m.target.forEach((t,i)=>{const v=m.placed[i];
      if(!v||v[0]!==t[0]||v[1]!==t[1]){mk('circle',{cx:t[0],cy:t[1],r:.24,class:'pt-sol'});const l=labelPos(t,ct,N);txt(LETTERS[i]+PR,l[0],l[1],'lbl ok');}});
    m.placed.forEach((v,i)=>{if(!v)return;
      const t=m.target[i],right=v[0]===t[0]&&v[1]===t[1];
      const cls=(m.checked||m.solved)?(right?'ok':'bad'):'ink';
      mk('circle',{cx:v[0],cy:v[1],r:.18,class:'pt-'+cls});
      const l=labelPos(v,ct,N);txt(LETTERS[i]+PR,l[0],l[1],'lbl '+cls);});
    addGhost();
  }
};

// ---------- Steuerung ----------
const MODES={erkennen:M1,achsen:M2,kaestchen:M3,punkte:M4};
function switchMode(k){
  state.mode=k;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.mode===k?'true':'false'));
  board.style.cursor=k==='erkennen'?'default':'crosshair';
  MODES[k].mount();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchMode(t.dataset.mode)));
board.addEventListener('click',e=>{const M=MODES[state.mode];if(M.click)M.click(svgPt(e));});
board.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const M=MODES[state.mode];if(M.move)M.move(svgPt(e));});
board.addEventListener('pointerleave',()=>{if(ghost){ghost.setAttribute('cx',-9);ghost.setAttribute('cy',-9);}});
switchMode('erkennen');
})();
</script>
</body>
